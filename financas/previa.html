<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2b3524">
  <title>Caderneta · finanças da casa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* Caderneta — finanças da casa
   Paleta: verde musgo, marrom, bege. Sem gradientes, sem brilho: papel e tinta. */
:root {
  --musgo-950: #1f271a;
  --musgo-900: #2b3524;
  --musgo-800: #36432c;
  --musgo-700: #46563a;
  --musgo-600: #5a6c48;
  --musgo-500: #6f8257;
  --musgo-200: #cfd6bf;
  --musgo-100: #e4e8d8;
  --musgo-50: #f0f2e8;

  --marrom-800: #4a3424;
  --marrom-700: #5e4330;
  --marrom-600: #7a5940;
  --marrom-400: #a88466;
  --marrom-200: #dcc9b5;

  --bege-50: #fbf8f1;
  --bege-100: #f5f0e5;
  --bege-200: #ece4d4;
  --bege-300: #e0d4bd;
  --bege-400: #cdbd9f;

  --tinta: #26231d;
  --tinta-2: #57503f;
  --tinta-3: #857c69;

  --ok: #3f7a1c;
  --ok-bg: #e5eed7;
  --atencao: #8a5a00;
  --atencao-bg: #f6e8c6;
  --critico: #a8352b;
  --critico-bg: #f6dcd5;
  --info: #2f5f9a;
  --info-bg: #dfe8f2;

  --raio: 10px;
  --borda: 1px solid var(--bege-300);
  --fonte: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fonte-titulo: 'Fraunces', Georgia, 'Times New Roman', serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--fonte);
  font-size: 14px;
  line-height: 1.45;
  color: var(--tinta);
  background: var(--bege-100);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--musgo-700); }
h1, h2, h3 { font-family: var(--fonte-titulo); font-weight: 500; letter-spacing: -0.01em; margin: 0; }

/* ---------- estrutura ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }

.lateral {
  background: var(--musgo-900);
  color: var(--bege-200);
  padding: 22px 14px 18px;
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.marca { padding: 0 10px 18px; border-bottom: 1px solid rgba(236, 228, 212, .12); margin-bottom: 12px; }
.marca h1 { font-size: 23px; color: var(--bege-50); font-weight: 600; }
.marca p { margin: 2px 0 0; font-size: 12px; color: var(--musgo-200); opacity: .8; }

.nav-grupo { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--musgo-200); opacity: .55; padding: 14px 10px 4px; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: 7px;
  color: var(--bege-200); text-decoration: none; font-size: 13.5px;
}
.nav a svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; opacity: .75; flex: none; }
.nav a:hover { background: var(--musgo-800); }
.nav a.ativo { background: var(--bege-100); color: var(--musgo-900); font-weight: 500; }
.nav a.ativo svg { opacity: 1; }
.nav .contador { margin-left: auto; background: var(--critico); color: #fff; font-size: 11px; border-radius: 10px; padding: 0 7px; line-height: 18px; }

.lateral-rodape { margin-top: auto; padding: 14px 10px 0; font-size: 11.5px; color: var(--musgo-200); opacity: .7; border-top: 1px solid rgba(236, 228, 212, .12); }

.principal { min-width: 0; display: flex; flex-direction: column; }

.topo {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 18px 32px; border-bottom: var(--borda); background: var(--bege-50);
  position: sticky; top: 0; z-index: 5;
}
.topo h2 { font-size: 24px; margin-right: auto; }
.topo h2 small { display: block; font-family: var(--fonte); font-size: 12.5px; color: var(--tinta-3); font-weight: 400; letter-spacing: 0; }

.seletor-mes { display: inline-flex; align-items: center; border: var(--borda); border-radius: 8px; background: #fff; }
.seletor-mes button { border: 0; background: none; padding: 7px 10px; cursor: pointer; color: var(--tinta-2); }
.seletor-mes button:hover { color: var(--musgo-700); }
.seletor-mes span { min-width: 128px; text-align: center; font-weight: 500; text-transform: capitalize; }

.segmentado { display: inline-flex; border: var(--borda); border-radius: 8px; background: #fff; padding: 2px; }
.segmentado button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; cursor: pointer; color: var(--tinta-2); font-size: 13px; }
.segmentado button.ativo { background: var(--musgo-700); color: var(--bege-50); }

.conteudo { padding: 26px 32px 60px; display: flex; flex-direction: column; gap: 20px; max-width: 1320px; width: 100%; }

/* ---------- botões e campos ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--bege-400); background: #fff; color: var(--tinta);
  padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 13.5px; white-space: nowrap;
}
.btn:hover { border-color: var(--marrom-400); }
.btn-p { background: var(--musgo-700); border-color: var(--musgo-700); color: var(--bege-50); }
.btn-p:hover { background: var(--musgo-800); border-color: var(--musgo-800); }
.btn-m { background: var(--marrom-700); border-color: var(--marrom-700); color: var(--bege-50); }
.btn-l { background: none; border-color: transparent; color: var(--musgo-700); padding-inline: 6px; }
.btn-l:hover { text-decoration: underline; border-color: transparent; }
.btn-perigo { color: var(--critico); }
.btn-pq { padding: 4px 9px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: default; }

.campo { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--tinta-2); }
.campo input, .campo select, .campo textarea, .filtros input, .filtros select, .tabela input, .tabela select {
  border: var(--borda); background: #fff; border-radius: 7px; padding: 7px 10px; font-size: 13.5px; color: var(--tinta);
  min-width: 0;
}
.campo input:focus, .campo select:focus, .campo textarea:focus, .filtros input:focus, .filtros select:focus, .tabela input:focus, .tabela select:focus {
  outline: 2px solid var(--musgo-200); border-color: var(--musgo-500);
}
:focus-visible { outline: 2px solid var(--musgo-500); outline-offset: 2px; }
.grade-campos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; }
.grade-campos .inteiro { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--tinta-2); cursor: pointer; }
.check input { accent-color: var(--musgo-700); width: 15px; height: 15px; }

/* ---------- cartões ---------- */
.cartao { background: var(--bege-50); border: var(--borda); border-radius: var(--raio); padding: 18px 20px; min-width: 0; }
.cartao > header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.cartao > header h3 { font-size: 17px; margin-right: auto; }
.cartao > header .sub { color: var(--tinta-3); font-size: 12.5px; }
.cartao > header select { border: var(--borda); background: #fff; border-radius: 7px; padding: 5px 8px; font-size: 13px; }
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grade-3 { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 20px; }
.grade-21 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
.grade-12 { display: grid; grid-template-columns: 1fr 1.6fr; gap: 20px; }

/* números de destaque */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; background: var(--bege-50); border: var(--borda); border-radius: var(--raio); }
.kpi { padding: 18px 20px; border-left: var(--borda); }
.kpi:first-child { border-left: 0; }
.kpi .rot { font-size: 12.5px; color: var(--tinta-3); display: flex; align-items: center; gap: 6px; }
.kpi .val { font-family: var(--fonte-titulo); font-size: 28px; font-weight: 500; margin-top: 4px; letter-spacing: -0.02em; }
.kpi .det { font-size: 12.5px; color: var(--tinta-2); margin-top: 2px; }
.kpi .det b { font-weight: 500; }
.sobe { color: var(--critico); } .desce { color: var(--ok); }
.neg { color: var(--critico); }

/* ---------- alertas ---------- */
.alertas { display: flex; flex-direction: column; gap: 8px; }
.alerta { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
.alerta .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff; }
.alerta b { display: block; font-weight: 500; }
.alerta span { color: var(--tinta-2); font-size: 12.5px; }
.alerta .tot { font-weight: 500; white-space: nowrap; }
.alerta-critico { background: var(--critico-bg); } .alerta-critico .ic { background: var(--critico); }
.alerta-atencao { background: var(--atencao-bg); } .alerta-atencao .ic { background: var(--atencao); }
.alerta-info { background: var(--info-bg); } .alerta-info .ic { background: var(--info); }
.tudo-certo { color: var(--tinta-2); padding: 10px 12px; background: var(--ok-bg); border-radius: 8px; }

/* ---------- status ---------- */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px 2px 7px; border-radius: 20px; white-space: nowrap; border: 0; cursor: pointer; font-weight: 500; }
.st::before { font-size: 11px; width: 12px; text-align: center; }
.st-pago { background: var(--ok-bg); color: var(--ok); } .st-pago::before { content: '✓'; }
.st-pendente { background: var(--bege-200); color: var(--tinta-2); } .st-pendente::before { content: '○'; }
.st-hoje { background: var(--atencao-bg); color: var(--atencao); } .st-hoje::before { content: '◷'; }
.st-atrasado { background: var(--critico-bg); color: var(--critico); } .st-atrasado::before { content: '!'; font-weight: 700; }
.st-receita { background: var(--info-bg); color: var(--info); } .st-receita::before { content: '↓'; }

.etq { display: inline-block; font-size: 11.5px; padding: 1px 8px; border-radius: 4px; background: var(--bege-200); color: var(--tinta-2); white-space: nowrap; }
.etq-casal { background: var(--marrom-200); color: var(--marrom-800); }
.etq-a { background: var(--musgo-100); color: var(--musgo-800); }
.etq-b { background: #eadff0; color: #5d3a63; }
.etq-ia { background: var(--info-bg); color: var(--info); }

/* ---------- tabelas ---------- */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.filtros input[type=search] { min-width: 220px; flex: 1; max-width: 320px; }
.tabela-envolve { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
.tabela { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tabela th { text-align: left; font-weight: 500; font-size: 12px; color: var(--tinta-3); padding: 8px 10px; border-bottom: var(--borda); white-space: nowrap; }
.tabela td { padding: 9px 10px; border-bottom: 1px solid var(--bege-200); vertical-align: middle; }
.tabela tr:hover td { background: var(--bege-100); }
.tabela .num { text-align: right; white-space: nowrap; }
.tabela .desc { font-weight: 500; }
.tabela .desc small { display: block; font-weight: 400; color: var(--tinta-3); font-size: 12px; }
.tabela .acoes { text-align: right; white-space: nowrap; }
.tabela tfoot td { font-weight: 500; border-bottom: 0; border-top: var(--borda); }
.tabela .receita-v { color: var(--ok); }
.vazio { color: var(--tinta-3); text-align: center; padding: 26px 10px; }

/* ---------- gráficos ---------- */
.rosca { display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: center; }
.rosca svg { width: 180px; height: 180px; }
.rosca .fatia { cursor: pointer; transition: opacity .15s; outline: none; }
.rosca svg:hover .fatia { opacity: .55; }
.rosca svg .fatia:hover, .rosca svg .fatia:focus { opacity: 1; }
.rosca-v { font-family: var(--fonte-titulo); font-size: 19px; fill: var(--tinta); }
.rosca-r { font-size: 10.5px; fill: var(--tinta-3); }
.legenda { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.legenda li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; }
.legenda i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legenda b { font-weight: 500; }
.legenda em { font-style: normal; color: var(--tinta-3); font-size: 11.5px; min-width: 58px; text-align: right; }
.legenda-h { flex-direction: row; gap: 18px; margin-bottom: 6px; }
.legenda-h li { display: inline-flex; gap: 7px; }
.legenda .linha-k { width: 16px; height: 2px; border-radius: 1px; }

.barras { display: flex; flex-direction: column; gap: 9px; }
.barra-l { display: grid; grid-template-columns: 150px 1fr 96px; gap: 12px; align-items: center; font-size: 13px; cursor: default; outline: none; }
.barra-n { color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-trilho { position: relative; height: 14px; }
.barra-f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; transition: filter .15s; }
.barra-l:hover .barra-f, .barra-l:focus .barra-f { filter: brightness(1.15); }
.barra-o { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tinta); border-radius: 1px; }
.barra-v { text-align: right; font-weight: 500; }

.grafico-linhas .grade { stroke: var(--bege-300); stroke-width: 1; }
.grafico-linhas .eixo { fill: var(--tinta-3); font-size: 11px; }
.grafico-linhas .rotulo-fim { fill: var(--tinta-2); font-size: 11.5px; }
.grafico-linhas .mira { stroke: var(--tinta-3); stroke-width: 1; }
.grafico-linhas .alvo { cursor: crosshair; outline: none; }

.prog { display: block; height: 6px; background: var(--bege-200); border-radius: 3px; overflow: hidden; }
.prog > span { display: block; height: 100%; border-radius: 3px; }
.prog-ok > span { background: var(--musgo-600); }
.prog-atencao > span { background: #c48a12; }
.prog-critico > span { background: var(--critico); }
.prog-meta > span { background: var(--marrom-600); }

.tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--tinta); color: var(--bege-50); border-radius: 7px; padding: 8px 11px; font-size: 12.5px;
  box-shadow: 0 6px 18px rgba(30, 25, 15, .18); min-width: 140px;
}
.tip-t { color: var(--bege-400); font-size: 11.5px; margin-bottom: 4px; text-transform: capitalize; }
.tip-r { display: flex; align-items: center; gap: 8px; }
.tip-r i { width: 12px; height: 2px; border-radius: 1px; }
.tip-r b { font-weight: 600; }
.tip-r span { color: var(--bege-300); }

/* ---------- listas ---------- */
.lista { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 52px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--bege-200); }
.item:last-child { border-bottom: 0; }
.dia { text-align: center; line-height: 1.1; border-right: var(--borda); padding-right: 10px; }
.dia b { display: block; font-family: var(--fonte-titulo); font-size: 20px; font-weight: 500; }
.dia span { font-size: 11px; color: var(--tinta-3); text-transform: uppercase; }
.item .t { font-weight: 500; }
.item .t small { display: block; font-weight: 400; color: var(--tinta-3); font-size: 12px; }
.item .v { font-weight: 500; text-align: right; }

.secao-pagar h4 { font-family: var(--fonte); font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--tinta-3); font-weight: 600; margin: 4px 0 2px; display: flex; justify-content: space-between; }

/* ---------- importação ---------- */
.soltar {
  display: block;
  border: 1.5px dashed var(--bege-400); border-radius: var(--raio); background: #fff;
  padding: 34px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
}
.soltar:hover, .soltar.sobre { border-color: var(--musgo-500); background: var(--musgo-50); }
.soltar h3 { font-size: 19px; margin-bottom: 4px; }
.soltar p { margin: 0; color: var(--tinta-3); }
.soltar .formatos { margin-top: 12px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

.pipeline { display: flex; align-items: center; gap: 0; margin: 4px 0 2px; flex-wrap: wrap; }
.etapa { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: var(--borda); border-radius: 8px; background: #fff; font-size: 12.5px; color: var(--tinta-3); }
.etapa .sig { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; background: var(--bege-200); color: var(--tinta-2); }
.etapa.ativa { border-color: var(--musgo-500); color: var(--tinta); }
.etapa.ativa .sig { background: var(--musgo-700); color: var(--bege-50); animation: pulsa 1s infinite alternate; }
.etapa.feita .sig { background: var(--musgo-200); color: var(--musgo-900); }
.seta { width: 22px; height: 1px; background: var(--bege-400); }
@keyframes pulsa { to { opacity: .55; } }

.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-3); }
.conf i { width: 34px; height: 4px; background: var(--bege-200); border-radius: 2px; position: relative; overflow: hidden; }
.conf i::after { content: ''; position: absolute; inset: 0; width: var(--c); background: var(--musgo-600); }
.conf.baixa i::after { background: var(--critico); }

/* ---------- agentes ---------- */
.agentes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.agente { background: #fff; border: var(--borda); border-radius: var(--raio); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.agente header { display: flex; align-items: center; gap: 10px; }
.agente .sig { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--musgo-800); color: var(--bege-100); font-weight: 600; font-size: 12px; letter-spacing: .04em; }
.agente h4 { margin: 0; font-family: var(--fonte-titulo); font-weight: 500; font-size: 16px; }
.agente .estado { margin-left: auto; font-size: 11.5px; color: var(--tinta-3); display: flex; align-items: center; gap: 5px; }
.agente .estado::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--bege-400); }
.agente.trabalhando .estado::before { background: var(--musgo-500); animation: pulsa .6s infinite alternate; }
.agente.desligado .estado::before { background: var(--critico); }
.agente p { margin: 0; color: var(--tinta-2); font-size: 12.5px; }
.agente .ult { font-size: 12px; color: var(--tinta-3); border-top: 1px solid var(--bege-200); padding-top: 6px; margin-top: auto; }

.diario { font-size: 12.5px; max-height: 460px; overflow-y: auto; }
.diario li { display: grid; grid-template-columns: 96px 110px 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--bege-200); }
.diario time { color: var(--tinta-3); }
.diario .quem { font-weight: 500; color: var(--musgo-700); }
.diario .aviso .msg { color: var(--atencao); } .diario .erro .msg { color: var(--critico); }
ul.diario { list-style: none; padding: 0; margin: 0; }

/* ---------- metas ---------- */
.metas { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.meta { background: #fff; border: var(--borda); border-radius: var(--raio); padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.meta h4 { margin: 0; font-family: var(--fonte-titulo); font-weight: 500; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; }
.meta h4 small { font-family: var(--fonte); font-size: 12px; color: var(--tinta-3); font-weight: 400; }
.meta .valores { display: flex; justify-content: space-between; font-size: 13px; color: var(--tinta-2); }
.meta .valores b { color: var(--tinta); font-size: 18px; font-weight: 500; font-family: var(--fonte-titulo); }
.meta .prog { height: 8px; }
.meta .nota { font-size: 12.5px; color: var(--tinta-2); background: var(--bege-100); border-radius: 6px; padding: 7px 9px; }
.meta footer { display: flex; gap: 6px; margin-top: 4px; }

/* ---------- orçamento / alocação ---------- */
.alocacao { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.balde { border: var(--borda); border-radius: 9px; padding: 12px 14px; background: #fff; display: flex; flex-direction: column; gap: 6px; }

  <script>
/* Utilitários compartilhados por todos os agentes e telas */
window.FC = window.FC || {};

FC.util = (() => {
  const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  const num = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho',
    'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const MESES_CURTOS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  const pad = (n) => String(n).padStart(2, '0');

  return {
    MESES, MESES_CURTOS,
    uid: () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    moeda: (v) => brl.format(Number(v) || 0),
    moedaCurta(v) {
      const a = Math.abs(v);
      if (a >= 1e6) return 'R$ ' + num.format(v / 1e6) + ' mi';
      if (a >= 1e3) return 'R$ ' + num.format(v / 1e3) + ' mil';
      return brl.format(v);
    },
    pct: (v) => num.format(v) + '%',
    hoje() {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    },
    iso(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
    parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
    dataBR(s) { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; },
    dataCurta(s) { if (!s) return '—'; const [, m, d] = s.split('-'); return `${d} ${MESES_CURTOS[+m - 1]}`; },
    mesDe: (s) => (s || '').slice(0, 7),
    mesLabel(ym) { const [y, m] = ym.split('-'); return `${MESES[+m - 1]} ${y}`; },
    mesCurto(ym) { const [y, m] = ym.split('-'); return `${MESES_CURTOS[+m - 1]}/${y.slice(2)}`; },
    somaMes(ym, delta) {
      const [y, m] = ym.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    },
    diasEntre(a, b) { return Math.round((FC.util.parseISO(b) - FC.util.parseISO(a)) / 86400000); },
    somaDias(s, n) { const d = FC.util.parseISO(s); d.setDate(d.getDate() + n); return FC.util.iso(d); },
    /* Ajusta o dia para o mês de destino (ex.: dia 31 em fevereiro vira 28/29) */
    mesmoDiaNoMes(isoData, ym) {
      const dia = +isoData.slice(8, 10);
      const [y, m] = ym.split('-').map(Number);
      const ultimo = new Date(y, m, 0).getDate();
      return `${ym}-${pad(Math.min(dia, ultimo))}`;
    },
    /* "1.234,56" | "1234.56" | "R$ 99,90" → número */
    parseValor(txt) {
      if (typeof txt === 'number') return txt;
      if (!txt) return 0;
      let s = String(txt).replace(/[^\d,.\-]/g, '');
      if (s.includes(',') && s.includes('.')) {
        s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
      } else if (s.includes(',')) {
        s = s.replace(',', '.');
      }
      const v = parseFloat(s);
      return isNaN(v) ? 0 : v;
    },
    normalizar: (s) => (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''),
    esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    },
    baixar(nome, conteudo, tipo = 'text/plain') {
      const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nome;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    },
    carregarScript(src) {
      return new Promise((ok, erro) => {
        const ja = document.querySelector(`script[src="${src}"]`);
        if (ja && ja.dataset.carregado) return ok();
        if (ja) ja.remove();
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => { s.dataset.carregado = '1'; ok(); };
        s.onerror = () => { s.remove(); erro(new Error('Falha ao carregar ' + src)); };
        document.head.appendChild(s);
      });
    },
    arquivoParaBase64(file) {
      return new Promise((ok, erro) => {
        const r = new FileReader();
        r.onload = () => ok(String(r.result).split(',')[1]);
        r.onerror = erro;
        r.readAsDataURL(file);
      });
    },
  };
})();

/* Estado do app, persistido no navegador (localStorage). Nada sai do seu computador. */
FC.store = (() => {
  const CHAVE = 'controle-financeiro:v1';

  const CATEGORIAS_PADRAO = [
    ['moradia', 'Moradia', 'essenciais', 3200],
    ['contas', 'Contas da casa', 'essenciais', 650],

  function configPadrao() {
    return {
      pessoas: { a: 'Marcos', b: 'Noiva' },
      divisao: { modo: 'proporcional', pctA: 50 },
      alocacao: { essenciais: 50, pessoal: 20, reserva: 15, metas: 15 },
      reservaMeses: 6,
      ocr: false,
      ia: { apiKey: '', modelo: 'claude-opus-5-5', sempre: false },
    };
  }

  function vazio() {
    return {
      versao: 1,
      demo: false,
      config: configPadrao(),
      categorias: JSON.parse(JSON.stringify(CATEGORIAS_PADRAO)),
      lancamentos: [],
      metas: [
        { id: 'reserva', nome: 'Reserva de emergência', alvo: 0, guardado: 0, prazo: '', especial: true },
      ],
      regras: [],
      diario: [],
    };
  }

  /* ---------- dados de exemplo (gerados em torno do mês atual) ---------- */
  function demo() {
    const st = vazio();
    st.demo = true;
    const U = FC.util;
    const hoje = U.hoje();
    const mesAtual = U.mesDe(hoje);
    let semente = 7;
    const rnd = () => { semente = (semente * 9301 + 49297) % 233280; return semente / 233280; };
    const varia = (base, amp) => Math.round((base + (rnd() - 0.5) * 2 * amp) * 100) / 100;
    const L = [];

    const add = (o) => {
      const venc = o.vencimento || o.data;
      const passou = venc < hoje;
      L.push(Object.assign({
        id: U.uid(), tipo: 'despesa', conta: 'casal', pagoPor: 'a',
        status: passou ? 'pago' : 'pendente', pagoEm: passou ? venc : '',
        forma: 'pix', recorrente: false, origem: 'manual', notas: '',
      }, o, { vencimento: venc }));
    };

    for (let i = -11; i <= 0; i++) {
      const ym = U.somaMes(mesAtual, i);
      const d = (dia) => `${ym}-${String(dia).padStart(2, '0')}`;
      const alterna = i % 2 === 0 ? 'a' : 'b';

      add({ tipo: 'receita', descricao: 'Salário', valor: i > -5 ? 8200 : 7800, data: d(5), categoriaId: 'salario', conta: 'a', pagoPor: 'a', recorrente: true });
      add({ tipo: 'receita', descricao: 'Salário', valor: 6400, data: d(5), categoriaId: 'salario', conta: 'b', pagoPor: 'b', recorrente: true });
      if (i % 3 === 0) add({ tipo: 'receita', descricao: 'Freela — projeto site', valor: varia(1400, 500), data: d(22), categoriaId: 'extra', conta: 'a', pagoPor: 'a' });

      add({ descricao: 'Aluguel apartamento', valor: 2650, data: d(10), categoriaId: 'moradia', pagoPor: 'a', recorrente: true, forma: 'boleto' });
      add({ descricao: 'Condomínio', valor: 520, data: d(10), categoriaId: 'moradia', pagoPor: 'b', recorrente: true, forma: 'boleto' });
      add({ descricao: 'Enel — energia', valor: varia(225, 50), data: d(15), categoriaId: 'contas', pagoPor: alterna, forma: 'boleto' });
      add({ descricao: 'Sabesp — água', valor: varia(92, 15), data: d(18), categoriaId: 'contas', pagoPor: 'b', forma: 'boleto' });
      add({ descricao: 'Vivo Fibra', valor: 129.9, data: d(20), categoriaId: 'contas', pagoPor: 'a', recorrente: true, forma: 'cartao' });
      add({ descricao: 'Carrefour', valor: varia(640, 140), data: d(7), categoriaId: 'mercado', pagoPor: 'a', forma: 'cartao' });
      add({ descricao: 'Assaí Atacadista', valor: varia(480, 120), data: d(21), categoriaId: 'mercado', pagoPor: 'b', forma: 'cartao' });
      add({ descricao: 'Hortifruti', valor: varia(150, 40), data: d(14), categoriaId: 'mercado', pagoPor: alterna, forma: 'pix' });
      add({ descricao: 'iFood', valor: varia(190, 70), data: d(12), categoriaId: 'restaurantes', pagoPor: alterna, forma: 'cartao' });
      add({ descricao: 'Jantar — Coco Bambu', valor: varia(260, 80), data: d(25), categoriaId: 'restaurantes', pagoPor: 'a', forma: 'cartao' });
      add({ descricao: 'Netflix', valor: 55.9, data: d(12), categoriaId: 'assinaturas', conta: 'b', pagoPor: 'b', recorrente: true, forma: 'cartao' });
      add({ descricao: 'Spotify Família', valor: 34.9, data: d(8), categoriaId: 'assinaturas', conta: 'a', pagoPor: 'a', recorrente: true, forma: 'cartao' });
      add({ descricao: 'Smart Fit', valor: 129.9, data: d(6), categoriaId: 'saude', conta: 'a', pagoPor: 'a', recorrente: true, forma: 'cartao' });
      add({ descricao: 'Uber', valor: varia(140, 50), data: d(16), categoriaId: 'transporte', conta: 'a', pagoPor: 'a', forma: 'cartao' });
      add({ descricao: 'Posto Shell', valor: varia(260, 60), data: d(9), categoriaId: 'transporte', conta: 'b', pagoPor: 'b', forma: 'cartao' });
      add({ descricao: 'Drogasil', valor: varia(95, 45), data: d(19), categoriaId: 'saude', conta: 'b', pagoPor: 'b', forma: 'cartao' });
      add({ descricao: 'Curso de inglês', valor: 289, data: d(10), categoriaId: 'educacao', conta: 'b', pagoPor: 'b', recorrente: true, forma: 'boleto' });
      add({ descricao: 'Petz — ração', valor: varia(170, 30), data: d(13), categoriaId: 'pets', pagoPor: alterna, forma: 'cartao' });

    // deixa o IPTU do mês passado em aberto para mostrar o alerta de atraso
    const iptu = L.find((l) => l.descricao.startsWith('IPTU'));
    iptu.status = 'pendente'; iptu.pagoEm = '';

    st.lancamentos = L;
    st.metas = [
      { id: 'reserva', nome: 'Reserva de emergência', alvo: 0, guardado: 19800, prazo: '', especial: true },
      { id: U.uid(), nome: 'Casamento', alvo: 48000, guardado: 23500, prazo: '2027-09-18' },

    st.regras = [{ padrao: 'villa jardim', categoriaId: 'casamento' }];
    return st;
  }

  let estado;
  try {
    const bruto = localStorage.getItem(CHAVE);
    estado = bruto ? JSON.parse(bruto) : null;
  } catch (e) { estado = null; }
  if (!estado) estado = demo();
  // migrações leves: garante campos novos
  estado.config = Object.assign(configPadrao(), estado.config);
  estado.config.ia = Object.assign(configPadrao().ia, estado.config.ia);
  estado.diario = estado.diario || [];
  estado.regras = estado.regras || [];

  let timer;
  function salvar(notificar = true) {
    clearTimeout(timer);
    timer = setTimeout(() => {
      try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { console.warn('Não foi possível salvar', e); }
    }, 120);
    if (notificar && FC.orquestrador) FC.orquestrador.emitir('mudou');
  }

  function substituir(novo) {
    Object.keys(estado).forEach((k) => delete estado[k]);
    Object.assign(estado, novo);
    salvar();
  }

  return {
    get estado() { return estado; },
    salvar,
    substituir,
    resetarVazio: () => substituir(vazio()),
    resetarDemo: () => substituir(demo()),
    categoria: (id) => estado.categorias.find((c) => c.id === id) || { id: 'outros', nome: 'Outros', grupo: 'pessoal', orcamento: 0 },
    nomeConta(c) {
      const p = estado.config.pessoas;
      return c === 'casal' ? 'Conjunta' : c === 'a' ? p.a : p.b;
    },
  };
})();

  <script>
/*
 * Orquestrador: registro de agentes + barramento de eventos.
 * Cada agente tem um papel único, registra o que fez no diário e
 * conversa com os outros apenas por eventos ou pelo orquestrador.
 */
FC.orquestrador = (() => {
  const agentes = {};
  const ouvintes = {};

  function registrar(def) {
    agentes[def.id] = Object.assign({ status: 'ocioso', ultimaAcao: null, execucoes: 0 }, def);
    return agentes[def.id];
  }

  function log(agenteId, mensagem, nivel = 'info') {
    const a = agentes[agenteId];
    if (a) { a.ultimaAcao = mensagem; a.execucoes++; }
    const entrada = { em: new Date().toISOString(), agente: agenteId, mensagem, nivel };
    const st = FC.store.estado;
    st.diario.unshift(entrada);
    if (st.diario.length > 300) st.diario.length = 300;
    FC.store.salvar(false);
    emitir('diario', entrada);
  }

  function status(agenteId, s) {
    if (agentes[agenteId]) agentes[agenteId].status = s;
    emitir('agente-status', { agenteId, status: s });
  }

  function on(evento, fn) { (ouvintes[evento] = ouvintes[evento] || []).push(fn); }
  function emitir(evento, dados) { (ouvintes[evento] || []).forEach((fn) => { try { fn(dados); } catch (e) { console.error(e); } }); }

  /*
   * Pipeline de importação: Leitor → (Analista IA | Extrator) → Classificador → Sentinela
   * Retorna uma lista de "rascunhos" para o usuário revisar antes de virar lançamento.
   */
  async function processarArquivo(file, opcoes) {
    const etapas = (e) => emitir('pipeline', { arquivo: file.name, etapa: e });
    try {
      etapas('leitor');
      const lido = await FC.agentes.leitor.ler(file);

      let rascunhos;
      if (lido.tipo === 'csv' || lido.tipo === 'ofx') {
        etapas('extrator');
        rascunhos = FC.agentes.extrator.extrairExtrato(lido);
      } else if (lido.tipo === 'pdf' && FC.agentes.extrator.pareceExtrato(lido.texto || '')) {
        // extrato bancário em PDF: uma linha por movimentação, lido localmente
        etapas('extrator');
        rascunhos = FC.agentes.extrator.extrairExtratoPDF(lido.texto, file.name);
      } else {
        const iaPronta = FC.agentes.ia.disponivel();
        const precisaIA = !lido.texto || lido.texto.trim().length < 25;
        if (iaPronta && (opcoes.usarIA || precisaIA)) {
          etapas('ia');
          try {
            rascunhos = [await FC.agentes.ia.analisar(lido)];
          } catch (e) {
            log('ia', `Não consegui analisar "${file.name}": ${e.message}. Caindo para o Extrator local.`, 'aviso');
          }
        }
        if (!rascunhos) {
          if (precisaIA && lido.tipo === 'imagem' && FC.store.estado.config.ocr) {
            etapas('leitor');
            lido.texto = await FC.agentes.leitor.ocr(file);
          }
          etapas('extrator');
          rascunhos = [FC.agentes.extrator.extrair(lido.texto || '', file.name)];
        }
      }

      etapas('classificador');
      rascunhos = rascunhos.map((r) => {
        const c = r.interno
          ? { categoriaId: r.tipo === 'despesa' ? 'investimentos' : 'extra', confianca: 0.9, motivo: 'entre suas contas — fica de fora' }
          : r.categoriaId ? { categoriaId: r.categoriaId, confianca: r.confianca ?? 0.8, motivo: 'sugerido pela IA' }
            : FC.agentes.classificador.classificar(r);
        return Object.assign({
          id: FC.util.uid(),
          tipo: 'despesa',
          conta: opcoes.conta,
          pagoPor: opcoes.conta === 'casal' ? 'a' : opcoes.conta,
          status: 'pendente',
          arquivo: file.name,
        }, r, c);
      });

      etapas('sentinela');
      rascunhos.forEach((r) => { r.duplicado = FC.agentes.sentinela.pareceDuplicado(r); });
      etapas('pronto');
      return rascunhos;
    } catch (e) {
      log('leitor', `Erro ao processar "${file.name}": ${e.message}`, 'erro');
      etapas('erro');
      return [];
    }
  }

  return { registrar, agentes, log, status, on, emitir, processarArquivo };
})();

FC.agentes = {};

  <script>
/* Agente Leitor — abre o arquivo e entrega texto (e o binário, quando a IA precisar). */
FC.agentes.leitor = (() => {
  const O = FC.orquestrador;
  O.registrar({
    id: 'leitor', nome: 'Leitor', papel: 'Abre PDFs, imagens, extratos CSV/OFX e devolve o texto bruto.',
    sigla: 'LE',
  });

  // pdf.js vem junto do app (pasta vendor/); se não estiver lá, usa a CDN
  const PDFJS = ['vendor/pdf.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js'];
  const PDFJS_WORKER = ['vendor/pdf.worker.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'];
  const TESSERACT = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';

  function tipoDe(file) {
    const n = file.name.toLowerCase();
    if (file.type === 'application/pdf' || n.endsWith('.pdf')) return 'pdf';
    if (file.type.startsWith('image/') || /\.(png|jpe?g|webp|heic)$/.test(n)) return 'imagem';
    if (n.endsWith('.ofx')) return 'ofx';
    if (n.endsWith('.csv')) return 'csv';
    return 'texto';
  }

  async function carregarPrimeiro(fontes) {
    for (let i = 0; i < fontes.length; i++) {
      try { await FC.util.carregarScript(fontes[i]); return i; } catch (e) { /* tenta a próxima */ }
    }
    throw new Error('não consegui carregar o leitor de PDF');
  }

  async function lerTexto(file) {
    const buf = await file.arrayBuffer();
    let txt = new TextDecoder('utf-8').decode(buf);
    if (txt.includes('�')) txt = new TextDecoder('iso-8859-1').decode(buf); // extratos de banco antigos
    return txt;
  }

  async function lerPDF(file) {
    const i = await carregarPrimeiro(PDFJS);
    const lib = window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER[i];
    // abrindo direto do disco (file://) o navegador bloqueia Workers: roda o worker na página
    if (location.protocol === 'file:' && !window.pdfjsWorker) await carregarPrimeiro(PDFJS_WORKER);
    const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
    const paginas = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const pag = await pdf.getPage(p);
      const conteudo = await pag.getTextContent();
      // reconstrói linhas agrupando itens pela coordenada vertical
      const linhas = new Map();
      conteudo.items.forEach((it) => {
        const y = Math.round(it.transform[5] / 3) * 3;
        if (!linhas.has(y)) linhas.set(y, []);
        linhas.get(y).push({ x: it.transform[4], s: it.str });
      });
      const texto = [...linhas.entries()].sort((a, b) => b[0] - a[0])
        .map(([, itens]) => itens.sort((a, b) => a.x - b.x).map((i) => i.s).join(' ').replace(/\s+/g, ' ').trim())
        .filter(Boolean).join('\n');
      paginas.push(texto);
    }
    return { paginas: pdf.numPages, texto: paginas.join('\n\n') };
  }

  async function ocr(file) {
    O.status('leitor', 'trabalhando');
    O.log('leitor', `Rodando OCR em "${file.name}" (pode levar alguns segundos)…`);
    await FC.util.carregarScript(TESSERACT);
    const r = await window.Tesseract.recognize(file, 'por');
    O.status('leitor', 'ocioso');
    O.log('leitor', `OCR concluído: ${r.data.text.length} caracteres lidos.`);
    return r.data.text;
  }

  async function ler(file) {
    O.status('leitor', 'trabalhando');
    const tipo = tipoDe(file);
    const saida = { nome: file.name, tipo, mime: file.type || (tipo === 'pdf' ? 'application/pdf' : ''), arquivo: file, texto: '' };
    try {
      if (tipo === 'pdf') {
        const r = await lerPDF(file);
        saida.texto = r.texto;
        O.log('leitor', `Li "${file.name}" (${r.paginas} pág., ${r.texto.length} caracteres${r.texto.length < 25 ? ' — parece digitalizado' : ''}).`);
      } else if (tipo === 'imagem') {
        O.log('leitor', `Recebi a imagem "${file.name}".`);
      } else {
        saida.texto = await lerTexto(file);
        O.log('leitor', `Li o arquivo de texto "${file.name}" (${saida.texto.split('\n').length} linhas).`);
      }
    } finally {
      O.status('leitor', 'ocioso');
    }
    return saida;
  }

  return { ler, ocr, tipoDe };
})();

</script>
  <script>
/* Agente Extrator — encontra valor, datas, estabelecimento, CNPJ e boletos no texto; lê extratos CSV/OFX. */
FC.agentes.extrator = (() => {
  const O = FC.orquestrador;
  const U = FC.util;
  O.registrar({
    id: 'extrator', nome: 'Extrator', sigla: 'EX',
    papel: 'Acha valores, datas, vencimento, CNPJ e linha digitável de boletos; converte extratos em lançamentos.',
  });

  const RE_VALOR = /(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})/g;
  const RE_CNPJ = /\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/;
  const MESES = { janeiro: 1, fevereiro: 2, marco: 3, abril: 4, maio: 5, junho: 6, julho: 7, agosto: 8, setembro: 9, outubro: 10, novembro: 11, dezembro: 12 };
  const ROTULOS_TOTAL = [
    /valor\s+(?:total\s+)?a\s+pagar/i, /total\s+a\s+pagar/i, /valor\s+do\s+documento/i, /valor\s+cobrado/i,
    /valor\s+total/i, /total\s+geral/i, /valor\s+pago/i, /valor\s+da\s+transfer[eê]ncia/i, /\btotal\b/i, /\bvalor\b/i,
  ];
  const GENERICAS = /^(documento auxiliar|danfe|nota fiscal|nfc-?e|cupom|recibo|comprovante|extrato|fatura|boleto|pagamento|via do cliente|consumidor|cnpj|cpf|data|hora|endere[cç]o|banco|ag[eê]ncia)/i;

  function paraISO(d, m, y) {
    y = +y; if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31) return '';
    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  function datasNoTexto(txt) {
    const achadas = [];
    const re = /\b(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\b/g;
    let m;
    while ((m = re.exec(txt))) { const iso = paraISO(+m[1], +m[2], m[3]); if (iso) achadas.push({ iso, pos: m.index }); }
    const reExt = /\b(\d{1,2})\s+de\s+([a-zç]+)\s+de\s+(\d{4})/gi;
    while ((m = reExt.exec(txt))) {
      const mes = MESES[U.normalizar(m[2])];
      if (mes) achadas.push({ iso: paraISO(+m[1], mes, m[3]), pos: m.index });
    }
    return achadas;
  }

  function dataRotulada(linhas, rotulo) {
    for (const l of linhas) {
      if (rotulo.test(l)) {
        const d = datasNoTexto(l);
        if (d.length) return d[0].iso;
      }
    }
    return '';
  }

  /* Boleto bancário (47 dígitos) e de concessionária/arrecadação (48 dígitos, começa com 8). */
  function lerBoleto(txt) {
    const candidatos = txt.replace(/[^\d\s.\-]/g, ' ').match(/(?:\d[\d.\s\-]{44,64}\d)/g) || [];
    for (const c of candidatos) {
      const dig = c.replace(/\D/g, '');
      if (dig.length === 47) {
        const fator = +dig.slice(33, 37);
        const valor = +dig.slice(37, 47) / 100;
        let venc = '';
        if (fator >= 1000) {
          // fator 1000 = 03/07/2000; o fator reinicia em 1000 a cada 9000 dias (último reinício: 22/02/2025)
          const base = new Date(1997, 9, 7);
          let d = new Date(base.getTime() + fator * 86400000);
          const limite = new Date(); limite.setFullYear(limite.getFullYear() - 5);
          while (d < limite) d = new Date(d.getTime() + 9000 * 86400000);
          venc = U.iso(d);
        }
        return { linha: dig, tipo: 'bancario', valor, vencimento: venc };
      }
      if (dig.length === 48 && dig[0] === '8') {
        const cod = [0, 12, 24, 36].map((i) => dig.slice(i, i + 11)).join('');
        const real = ['6', '7'].includes(cod[2]);
        return { linha: dig, tipo: 'arrecadacao', valor: real ? +cod.slice(4, 15) / 100 : 0, vencimento: '' };
      }
    }
    return null;
  }

  function acharValor(linhas) {
    for (const rot of ROTULOS_TOTAL) {
      for (let i = 0; i < linhas.length; i++) {
        if (!rot.test(linhas[i])) continue;
        if (/sub-?total|desconto|troco|tributos|impostos|aprox/i.test(linhas[i])) continue;
        const vals = (linhas[i].match(RE_VALOR) || []).map(U.parseValor).filter((v) => v > 0);
        if (vals.length) return { valor: vals[vals.length - 1], como: 'rótulo' };
        const prox = (linhas[i + 1] || '').match(RE_VALOR);
        if (prox) return { valor: U.parseValor(prox[0]), como: 'rótulo' };
      }
    }
    const todos = linhas.flatMap((l) => (l.match(RE_VALOR) || []).map(U.parseValor)).filter((v) => v > 0 && v < 1e7);
    if (todos.length) return { valor: Math.max(...todos), como: 'maior valor' };
    return { valor: 0, como: '' };
  }

  function acharEstabelecimento(linhas, nomeArquivo) {
    for (const rot of [/benefici[aá]rio|cedente/i, /raz[aã]o social/i, /favorecido|recebedor|destinat[aá]rio|para\s*:/i, /nome fantasia/i]) {
      for (let i = 0; i < linhas.length; i++) {
        if (!rot.test(linhas[i])) continue;
        const resto = linhas[i].split(/[:\-]\s*/).slice(1).join(' ').replace(RE_CNPJ, '').trim();
        if (resto.length > 2) return limpar(resto);
        if (linhas[i + 1] && linhas[i + 1].length > 2) return limpar(linhas[i + 1]);
      }
    }
    const iCnpj = linhas.findIndex((l) => RE_CNPJ.test(l));
    if (iCnpj > 0 && !GENERICAS.test(linhas[iCnpj - 1])) return limpar(linhas[iCnpj - 1]);
    const primeira = linhas.find((l) => /[a-zà-ú]{3,}/i.test(l) && !GENERICAS.test(l) && l.length < 60);
    if (primeira) return limpar(primeira);
    return nomeArquivo.replace(/\.[a-z0-9]+$/i, '').replace(/[_\-]+/g, ' ');
  }

  const limpar = (s) => s.replace(/\s{2,}/g, ' ').replace(/\b(ltda|me|eireli|s\.?a\.?|epp)\b\.?/gi, '').trim()
    .toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()).slice(0, 60);

  function acharItens(linhas) {
    return linhas
      .filter((l) => /[a-z]{3,}.*\s\d+,\d{2}$/i.test(l) && !/total|troco|desconto|pagar|tribut|valor/i.test(l))
      .slice(0, 12)
      .map((l) => { const m = l.match(/^(.*?)\s+(?:R\$\s*)?([\d.]+,\d{2})$/); return m ? { nome: m[1].trim(), valor: U.parseValor(m[2]) } : null; })
      .filter(Boolean);
  }

  function extrair(texto, nomeArquivo = '') {
    O.status('extrator', 'trabalhando');
    const linhas = texto.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const boleto = lerBoleto(texto);
    const val = acharValor(linhas);
    const datas = datasNoTexto(texto);
    const vencimento = (boleto && boleto.vencimento) || dataRotulada(linhas, /vencimento|vence em|pagar at[eé]/i);
    const data = dataRotulada(linhas, /emiss[aã]o|data da compra|data do pagamento|realizad[oa] em|data\s*:/i) || (datas[0] && datas[0].iso) || '';
    const cnpj = (texto.match(RE_CNPJ) || [''])[0];
    const estabelecimento = acharEstabelecimento(linhas, nomeArquivo);
    const n = U.normalizar(texto);
    const forma = boleto ? 'boleto' : /\bpix\b/.test(n) ? 'pix' : /cr[eé]dito|debito|cartao|visa|master|elo\b/.test(n) ? 'cartao' : /dinheiro/.test(n) ? 'dinheiro' : 'pix';
    const docTipo = boleto ? 'Boleto' : /nfc-?e|danfe|nota fiscal|cupom fiscal/.test(n) ? 'Nota fiscal' : /\bpix\b/.test(n) ? 'Comprovante Pix' : /fatura/.test(n) ? 'Fatura' : /recibo/.test(n) ? 'Recibo' : 'Documento';
    const valor = (boleto && boleto.valor) || val.valor;

    let confianca = 0.2;
    if (valor) confianca += val.como === 'rótulo' || boleto ? 0.35 : 0.15;
    if (data || vencimento) confianca += 0.2;
    if (cnpj || boleto) confianca += 0.15;
    if (estabelecimento) confianca += 0.1;

    const jaPago = ['Nota fiscal', 'Comprovante Pix', 'Recibo'].includes(docTipo);
    const r = {
      status: jaPago ? 'pago' : 'pendente',
      pagoEm: jaPago ? (data || U.hoje()) : '',
      descricao: estabelecimento,
      estabelecimento,
      cnpj,
      valor: Math.round(valor * 100) / 100,
      data: data || vencimento || U.hoje(),
      vencimento: vencimento || data || U.hoje(),
      linhaDigitavel: boleto ? boleto.linha : '',
      forma,
      docTipo,
      itens: acharItens(linhas),
      confiancaExtracao: Math.min(1, confianca),
      texto: texto.slice(0, 4000),
      origem: 'importado',
    };
    O.status('extrator', 'ocioso');
    O.log('extrator', `${docTipo} de ${estabelecimento || '?'}: ${U.moeda(r.valor)}${vencimento ? ', vence ' + U.dataBR(vencimento) : ''} (valor por ${boleto ? 'linha digitável' : val.como || '—'}).`);
    return r;
  }

  /* ---------------- extratos CSV / OFX ---------------- */
  function parseCSV(txt) {
    const prim = txt.split(/\r?\n/)[0] || '';
    const sep = [';', '\t', ','].sort((a, b) => prim.split(b).length - prim.split(a).length)[0];
    const linhas = [];
    let campo = '', linha = [], aspas = false;
    for (let i = 0; i < txt.length; i++) {
      const c = txt[i];
      if (aspas) {
        if (c === '"' && txt[i + 1] === '"') { campo += '"'; i++; } else if (c === '"') aspas = false; else campo += c;
      } else if (c === '"') aspas = true;
      else if (c === sep) { linha.push(campo); campo = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && txt[i + 1] === '\n') i++;
        linha.push(campo); campo = '';
        if (linha.some((x) => x.trim())) linhas.push(linha);
        linha = [];
      } else campo += c;
    }
    linha.push(campo);
    if (linha.some((x) => x.trim())) linhas.push(linha);
    return linhas;
  }

  function dataFlex(s) {
    s = (s || '').trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if (m) return paraISO(+m[1], +m[2], m[3]);
    m = s.match(/^(\d{4})(\d{2})(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return '';
  }

  function extrairExtrato(lido) {
    O.status('extrator', 'trabalhando');
    let itens = [];
    if (lido.tipo === 'ofx') {
      const blocos = lido.texto.split(/<STMTTRN>/i).slice(1);
      const tag = (b, t) => ((b.match(new RegExp(`<${t}>([^<\\r\\n]*)`, 'i')) || [])[1] || '').trim();
      itens = blocos.map((b) => ({ data: dataFlex(tag(b, 'DTPOSTED')), valor: parseFloat(tag(b, 'TRNAMT').replace(',', '.')), descricao: tag(b, 'MEMO') || tag(b, 'NAME') }));
    } else {
      const linhas = parseCSV(lido.texto);
      const iCab = linhas.findIndex((l) => l.some((c) => /data|date/i.test(c)));
      const cab = (linhas[iCab] || []).map((c) => U.normalizar(c));
      const col = (re) => cab.findIndex((c) => re.test(c));
      const cData = col(/data|date/);
      const cDesc = col(/descri|hist|lancamento|estabelecimento|title|memo|detalhe/);
      const cValor = col(/^valor|amount|quantia|valor \(r\$\)/);
      const cCred = col(/credito|entrada/);
      const cDeb = col(/debito|saida/);
      itens = linhas.slice(iCab + 1).map((l) => {
        let valor;
        if (cValor >= 0) valor = U.parseValor(l[cValor]);
        else valor = U.parseValor(l[cCred]) - Math.abs(U.parseValor(l[cDeb]));
        return { data: dataFlex(l[cData]), descricao: (l[cDesc] || '').trim(), valor };
      });
    }
    itens = itens.filter((i) => i.data && i.valor && !/saldo/i.test(i.descricao));
    const temNegativo = itens.some((i) => i.valor < 0);
    const rascunhos = itens.map((i) => ({
      tipo: temNegativo && i.valor > 0 ? 'receita' : 'despesa',
      descricao: i.descricao.replace(/\s{2,}/g, ' ').slice(0, 80) || 'Sem descrição',
      estabelecimento: i.descricao,
      valor: Math.abs(i.valor),
      data: i.data,
      vencimento: i.data,
      status: 'pago',
      pagoEm: i.data,
      forma: /pix/i.test(i.descricao) ? 'pix' : lido.tipo === 'ofx' ? 'debito' : 'cartao',
      docTipo: lido.tipo === 'ofx' ? 'Extrato OFX' : 'Extrato CSV',
      origem: 'importado',
      confiancaExtracao: 0.9,
    }));
    O.status('extrator', 'ocioso');
    O.log('extrator', `Extrato "${lido.nome}": ${rascunhos.length} movimentações encontradas${temNegativo ? '' : ' (tratadas como despesas de cartão)'}.`);
    return rascunhos;
  }

  /* ---------------- extrato bancário em PDF ---------------- */
  const MES_ABREV = { jan: 1, fev: 2, mar: 3, abr: 4, mai: 5, jun: 6, jul: 7, ago: 8, set: 9, out: 10, nov: 11, dez: 12 };
  const RE_DATA_CAB = /^(\d{1,2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?\s+(\d{4})\b\s*(.*)$/i;
  const RE_DATA_NUM = /^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+(.*)$/;
  const RE_VALOR_FIM = /(-?\s?)(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})\s*$/;
  const RODAPE = /^(tem alguma d[uú]vida|metropolitanas|caso a solu|dispon[ií]veis em|extrato gerado|cpf\b|ag[eê]ncia \d+ conta|valores em r\$|\d+ de \d+$|o saldo l[ií]quido|n[aã]o nos responsabilizamos|asseguramos|cnpj:|movimenta[cç][oõ]es$|saldo (inicial|final|do dia|anterior|em conta)|rendimento l[ií]quido|total de (entradas|sa[ií]das)\s*[+-]?\s*[\d.,]*$)/i;
  const INTERNO = /^(resgate|aplica[cç][aã]o)\s+(rdb|cdb|lci|lca|poupan[cç]a|caixinha)|dinheiro guardado|guardou|resgatou|caixinha|porquinho|cofrinho/i;
  const PREFIXOS = [
    [/^compra no d[eé]bito( via \w+)?\s+/i, 'debito', 'despesa'],
    [/^compra no cr[eé]dito\s+/i, 'cartao', 'despesa'],
    [/^transfer[eê]ncia enviada pelo pix\s+/i, 'pix', 'despesa'],
    [/^pix enviado( para)?\s+/i, 'pix', 'despesa'],
    [/^transfer[eê]ncia recebida( pelo pix)?\s+/i, 'pix', 'receita'],
    [/^pix recebido( de)?\s+/i, 'pix', 'receita'],
    [/^reembolso recebido( pelo pix)?\s+/i, 'pix', 'receita'],
    [/^pagamento de boleto( efetuado)?\s*/i, 'boleto', 'despesa'],
    [/^pagamento de fatura\s*/i, 'debito', 'despesa'],
  ];

  /* Extrato tem várias datas, cada uma com movimentações e valor no fim da linha. */
  function pareceExtrato(texto) {
    const linhas = texto.split('\n');
    const datas = linhas.filter((l) => RE_DATA_CAB.test(l.trim()) || RE_DATA_NUM.test(l.trim())).length;
    const comValor = linhas.filter((l) => RE_VALOR_FIM.test(l.trim())).length;
    return datas >= 3 && comValor >= 6 && /extrato|movimenta[cç]|total de (entradas|sa[ií]das)|saldo/i.test(texto);
  }

  const titulo = (s) => s.toLowerCase().replace(/(^|[\s(/-])\S/g, (c) => c.toUpperCase());

  function nomeLimpo(s) {
    let n = s
      .replace(/\s+-\s*$/, '')
      .replace(/\s+-\s+(•|\*|\d{2,3}\.).*$/, '') // corta CPF mascarado / CNPJ e o banco que vêm depois
      .replace(/\s+-\s+.*$/, '')
      .replace(/\s*\((transfer[eê]ncia|pix).*$/i, '')
      .replace(/^[\d.\/-]+\s+/, '') // CNPJ de MEI grudado no começo
      .replace(/\s{2,}/g, ' ')
      .trim();
    if (n === n.toUpperCase()) n = titulo(n);
    return n.slice(0, 70);
  }

  function extrairExtratoPDF(texto, nomeArquivo) {
    O.status('extrator', 'trabalhando');
    const linhas = texto.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const titular = U.normalizar(linhas[0] || '');
    const repetidas = new Set(linhas.slice(0, 4).map((l) => l)); // cabeçalho que se repete em cada página
    const inicio = Math.max(0, linhas.findIndex((l) => /^movimenta[cç][oõ]es/i.test(l)));
    let data = '', sinal = null;
    const itens = [];
    let atual = null;

    for (const l of linhas.slice(inicio)) {
      if (repetidas.has(l)) { atual = null; continue; }
      let resto = l;
      let m = l.match(RE_DATA_CAB);
      if (m) {
        data = paraISO(+m[1], MES_ABREV[m[2].toLowerCase().slice(0, 3)], m[3]);
        resto = m[4];
        atual = null;
      } else if ((m = l.match(RE_DATA_NUM)) && RE_VALOR_FIM.test(l)) {
        data = paraISO(+m[1], +m[2], m[3] || new Date().getFullYear());
        resto = m[4];
      }
      if (/^total de entradas/i.test(resto)) { sinal = 'receita'; atual = null; continue; }
      if (/^total de sa[ií]das/i.test(resto)) { sinal = 'despesa'; atual = null; continue; }
      if (!resto || RODAPE.test(resto)) { if (RODAPE.test(resto)) atual = null; continue; }

      const v = resto.match(RE_VALOR_FIM);
      if (v && data) {
        const bruto = resto.slice(0, v.index).trim();
        let forma = 'pix', tipo = sinal || (v[1].includes('-') ? 'despesa' : 'receita'), nome = bruto;
        for (const [re, f, t] of PREFIXOS) {
          if (re.test(bruto)) { nome = bruto.replace(re, ''); forma = f; if (!sinal) tipo = t; break; }
        }
        const interno = INTERNO.test(bruto) || (titular.length > 8 && U.normalizar(nome).startsWith(titular));
        atual = {
          data, tipo, forma, interno, bruto,
          descricao: interno ? bruto.replace(/\s+-\s+.*$/, '') : (nomeLimpo(nome) || bruto),
          valor: U.parseValor(v[2]),
        };
        itens.push(atual);
      }
      // linhas sem valor no fim são continuação (banco, agência, CNPJ) e ficam de fora
    }

    const rascunhos = itens.filter((i) => i.valor > 0).map((i) => ({
      tipo: i.tipo,
      descricao: i.descricao,
      estabelecimento: i.descricao,
      valor: i.valor,
      data: i.data,
      vencimento: i.data,
      status: 'pago',
      pagoEm: i.data,
      forma: i.forma,
      docTipo: 'Extrato PDF',
      origem: 'importado',
      interno: i.interno,
      notas: i.bruto,
      texto: i.bruto, // a linha original ("Reembolso recebido…", "Compra no débito…") também dá pistas ao Classificador
      confiancaExtracao: 0.9,
    }));
    const n = (t) => rascunhos.filter((r) => r.tipo === t && !r.interno);
    const soma = (ls) => ls.reduce((s, r) => s + r.valor, 0);
    O.status('extrator', 'ocioso');
    O.log('extrator', `Extrato "${nomeArquivo}": ${rascunhos.length} movimentações — ${n('receita').length} entradas (${U.moeda(soma(n('receita')))}), ${n('despesa').length} saídas (${U.moeda(soma(n('despesa')))}) e ${rascunhos.filter((r) => r.interno).length} movimentações internas (aplicação/resgate), deixadas de fora.`);
    return rascunhos;
  }

  return { extrair, extrairExtrato, extrairExtratoPDF, pareceExtrato, lerBoleto };
})();

    saude: ['farmacia', 'drogasil', 'droga raia', 'drogaria', 'pague menos', 'panvel', 'unimed', 'amil', 'sulamerica', 'bradesco saude', 'hapvida', 'hospital', 'clinica', 'laboratorio', 'fleury', 'dasa', 'consulta', 'dentista', 'odonto', 'psicolog', 'smart fit', 'smartfit', 'academia', 'bluefit', 'gympass', 'wellhub'],
    educacao: ['curso', 'escola', 'faculdade', 'universidade', 'udemy', 'alura', 'coursera', 'livraria', 'amazon livros', 'mensalidade', 'ingles', 'idiomas', 'material escolar'],
    restaurantes: ['ifood', 'rappi', 'restaurante', 'lanchonete', 'pizzaria', 'hamburgueria', 'mcdonald', 'burger king', 'bk ', 'outback', 'coco bambu', 'madero', 'starbucks', 'cafe', 'cafeteria', 'bar ', 'churrascaria', 'sushi', 'aiqfome', 'ze delivery', 'subway', 'habib'],
    lazer: ['cinema', 'cinemark', 'kinoplex', 'ingresso', 'sympla', 'eventim', 'teatro', 'show', 'parque', 'viagem', 'hotel', 'airbnb', 'booking', 'decolar', 'latam', 'gol ', 'azul ', 'steam', 'playstation', 'xbox', 'nintendo'],

    pets: ['petz', 'cobasi', 'petlove', 'veterinari', 'pet shop', 'petshop', 'racao', 'banho e tosa'],
    presentes: ['presente', 'floricultura', 'flores', 'vivara', 'pandora', 'giuliana flores', 'lojas americanas presente'],
    casamento: ['buffet', 'cerimonial', 'assessoria de casamento', 'fotografo', 'fotografia', 'filmagem', 'vestido de noiva', 'noiva', 'noivo', 'decoracao', 'convite', 'aliancas', 'alianca', 'dj ', 'banda', 'bem casado', 'bolo de casamento', 'igreja', 'cartorio', 'lua de mel', 'espaco de eventos', 'sitio', 'traje'],
    investimentos: ['tesouro', 'cdb', 'lci', 'lca', 'aporte', 'corretora', 'xp invest', 'rico ', 'clear', 'nuinvest', 'btg', 'previdencia', 'poupanca', 'reserva'],
    salario: ['salario', 'folha de pagamento', 'pagamento de salario', 'proventos', 'remuneracao'],
    extra: ['freela', 'freelance', 'venda', 'rendimento', 'dividendos', 'cashback', 'bonus', 'pix recebido'],
    reembolso: ['reembolso', 'estorno', 'devolucao'],
  };

  // o termo precisa começar no início de uma palavra ("gas" não casa com "drogasil")
  // termos curtos precisam ser a palavra inteira ("metro" não casa com "metropolitana")
  const casa = (txt, t) => {
    const i = txt.indexOf(t);
    if (i < 0) return false;
    const antesOk = i === 0 || !/[a-z0-9]/.test(txt[i - 1]);
    const depois = txt[i + t.length];
    const depoisOk = t.trim().length > 5 || !depois || !/[a-z0-9]/.test(depois);
    if (antesOk && depoisOk) return true;
    return casa(txt.slice(i + 1), t);
  };

  function classificar(r) {
    O.status('classificador', 'trabalhando');
    const alvo = U.normalizar(` ${r.descricao || ''} ${r.estabelecimento || ''} ${(r.itens || []).map((i) => i.nome).join(' ')} `);
    const texto = U.normalizar(r.texto || '');
    let resultado = null;

    // 1) memória: regras aprendidas com você têm prioridade
    const regra = FC.store.estado.regras.find((g) => alvo.includes(g.padrao));
    if (regra) resultado = { categoriaId: regra.categoriaId, confianca: 0.97, motivo: `regra aprendida: "${regra.padrao}"` };

    // 2) dicionário: pontua cada categoria; descrição pesa mais que o resto do documento
    if (!resultado) {
      let melhor = { id: null, pontos: 0, termo: '' };
      Object.entries(DICIONARIO).forEach(([id, termos]) => {
        if (!FC.store.estado.categorias.some((c) => c.id === id)) return;
        if ((r.tipo === 'receita') !== ['salario', 'extra', 'reembolso'].includes(id)) return;
        termos.forEach((t) => {
          const p = (casa(alvo, t) ? 3 : 0) + (casa(texto, t) ? 1 : 0);
          if (p > melhor.pontos) melhor = { id, pontos: p, termo: t.trim() };
        });
      });
      // categorias criadas por você: o próprio nome vira palavra-chave
      FC.store.estado.categorias.forEach((c) => {
        const t = U.normalizar(c.nome);
        if (t.length > 3 && casa(alvo, t) && melhor.pontos < 3) melhor = { id: c.id, pontos: 3, termo: t };
      });
      if (melhor.id) resultado = { categoriaId: melhor.id, confianca: melhor.pontos >= 3 ? 0.85 : 0.6, motivo: `palavra-chave "${melhor.termo}"` };
    }

    // 3) sem pistas: usa o histórico do mesmo estabelecimento
    if (!resultado) {
      const chave = U.normalizar(r.descricao).split(' ')[0];
      const igual = chave && FC.store.estado.lancamentos.find((l) => U.normalizar(l.descricao).startsWith(chave));
      resultado = igual
        ? { categoriaId: igual.categoriaId, confianca: 0.55, motivo: `parecido com "${igual.descricao}"` }
        : { categoriaId: r.tipo === 'receita' ? 'extra' : 'outros', confianca: 0.2, motivo: 'sem pistas — revise' };
    }
    O.status('classificador', 'ocioso');
    O.log('classificador', `"${r.descricao}" → ${FC.store.categoria(resultado.categoriaId).nome} (${Math.round(resultado.confianca * 100)}%, ${resultado.motivo}).`);
    return resultado;
  }

  /* Quando você corrige uma categoria, o agente guarda o padrão para a próxima vez. */
  function aprender(descricao, categoriaId) {
    const palavras = U.normalizar(descricao).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter((p) => p.length > 2 && !/^\d+$/.test(p));
    const padrao = palavras.slice(0, 2).join(' ');
    if (!padrao) return;
    const st = FC.store.estado;
    const existente = st.regras.find((g) => g.padrao === padrao);
    if (existente) existente.categoriaId = categoriaId; else st.regras.push({ padrao, categoriaId });
    FC.store.salvar(false);
    O.log('classificador', `Aprendi: "${padrao}" agora é ${FC.store.categoria(categoriaId).nome}.`);
  }

  return { classificar, aprender, DICIONARIO };
})();

  <script>
/*
 * Agente Analista IA (opcional) — usa o Claude para ler recibos difíceis:
 * PDFs digitalizados, fotos de cupom, faturas com layout estranho.
 * Só roda se você colocar sua chave da API em Ajustes. A chave fica neste navegador.
 */
FC.agentes.ia = (() => {
  const O = FC.orquestrador;
  const U = FC.util;
  O.registrar({
    id: 'ia', nome: 'Analista IA', sigla: 'IA',
    papel: 'Opcional. Envia o documento ao Claude e recebe valor, datas, itens e categoria já estruturados.',
  });

  let clienteCache = null;
  let chaveCache = '';

  function disponivel() { return !!FC.store.estado.config.ia.apiKey; }

  async function cliente() {
    const chave = FC.store.estado.config.ia.apiKey;
    if (clienteCache && chaveCache === chave) return clienteCache;
    const { default: Anthropic } = await import('https://esm.sh/@anthropic-ai/sdk');
    clienteCache = new Anthropic({ apiKey: chave, dangerouslyAllowBrowser: true });
    chaveCache = chave;
    return clienteCache;
  }

  function esquema() {
    const cats = FC.store.estado.categorias.map((c) => c.id);
    return {
      type: 'object',
      additionalProperties: false,
      required: ['tipo', 'estabelecimento', 'descricao', 'cnpj', 'valor_total', 'data', 'vencimento', 'forma_pagamento', 'tipo_documento', 'categoria', 'itens', 'parcela_atual', 'parcelas_total', 'confianca'],
      properties: {
        tipo: { type: 'string', enum: ['despesa', 'receita'] },
        estabelecimento: { type: 'string', description: 'Nome fantasia de quem recebeu o pagamento' },
        descricao: { type: 'string', description: 'Descrição curta para o lançamento, ex.: "Enel — energia out/2026"' },
        cnpj: { type: 'string', description: 'CNPJ ou string vazia' },
        valor_total: { type: 'number', description: 'Valor final pago ou a pagar, em reais' },
        data: { type: 'string', description: 'Data da compra/emissão em AAAA-MM-DD, ou vazia' },
        vencimento: { type: 'string', description: 'Data de vencimento em AAAA-MM-DD, ou vazia' },
        forma_pagamento: { type: 'string', enum: ['pix', 'cartao', 'debito', 'boleto', 'dinheiro', 'outro'] },
        tipo_documento: { type: 'string', description: 'Ex.: Nota fiscal, Boleto, Comprovante Pix, Fatura, Recibo' },
        categoria: { type: 'string', enum: cats },
        itens: {
          type: 'array',
          items: {
            type: 'object', additionalProperties: false, required: ['nome', 'valor'],
            properties: { nome: { type: 'string' }, valor: { type: 'number' } },
          },
        },
        parcela_atual: { type: 'integer', description: '0 se não for parcelado' },
        parcelas_total: { type: 'integer', description: '0 se não for parcelado' },
        confianca: { type: 'number', description: 'De 0 a 1, quão seguro você está do valor e das datas' },
      },
    };
  }

  async function analisar(lido) {
    O.status('ia', 'trabalhando');
    O.log('ia', `Enviando "${lido.nome}" ao Claude…`);
    try {
      const cfg = FC.store.estado.config.ia;
      const cats = FC.store.estado.categorias.map((c) => `${c.id} = ${c.nome} (${c.grupo})`).join('\n');
      const conteudo = [];
      if (lido.tipo === 'pdf' || lido.tipo === 'imagem') {
        const data = await U.arquivoParaBase64(lido.arquivo);
        conteudo.push(lido.tipo === 'pdf'
          ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data } }
          : { type: 'image', source: { type: 'base64', media_type: lido.mime || 'image/jpeg', data } });
      } else {
        conteudo.push({ type: 'text', text: lido.texto.slice(0, 50000) });
      }
      conteudo.push({
        type: 'text',
        text: `Este é um documento financeiro pessoal brasileiro (recibo, nota fiscal, boleto, fatura ou comprovante).
Extraia os dados para um controle financeiro de um casal. Use o valor FINAL (após descontos), não subtotais.
Datas no formato AAAA-MM-DD. Hoje é ${U.hoje()}.
Escolha a categoria mais adequada entre:
${cats}`,
      });

      const c = await cliente();
      const resp = await c.beta.messages.create({
        model: cfg.modelo || 'claude-opus-5-5',
        max_tokens: 4000,
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        output_config: { effort: 'low', format: { type: 'json_schema', schema: esquema() } },
        messages: [{ role: 'user', content: conteudo }],
      });
      if (resp.stop_reason === 'refusal') throw new Error('o modelo recusou este documento');
      const bloco = resp.content.find((b) => b.type === 'text');
      if (!bloco) throw new Error('resposta vazia');
      const j = JSON.parse(bloco.text);

      const r = {
        tipo: j.tipo,
        descricao: j.descricao || j.estabelecimento,
        estabelecimento: j.estabelecimento,
        cnpj: j.cnpj,
        valor: Math.round((j.valor_total || 0) * 100) / 100,
        data: j.data || j.vencimento || U.hoje(),
        vencimento: j.vencimento || j.data || U.hoje(),
        forma: j.forma_pagamento,
        docTipo: j.tipo_documento,
        itens: j.itens || [],
        parcela: j.parcelas_total > 1 ? { n: j.parcela_atual || 1, total: j.parcelas_total } : null,
        categoriaId: j.categoria,
        confianca: j.confianca,
        confiancaExtracao: j.confianca,
        origem: 'ia',
      };
      // regras que você ensinou valem mais que o palpite da IA
      const regra = FC.store.estado.regras.find((g) => U.normalizar(r.descricao).includes(g.padrao));
      if (regra) { r.categoriaId = regra.categoriaId; r.confianca = 0.97; }

      O.log('ia', `${r.docTipo}: ${r.estabelecimento} — ${U.moeda(r.valor)}, categoria ${FC.store.categoria(r.categoriaId).nome} (${Math.round((j.confianca || 0) * 100)}%).`);
      return r;
    } finally {
      O.status('ia', 'ocioso');
    }
  }

  async function testar() {
    const c = await cliente();
    const resp = await c.messages.create({
      model: FC.store.estado.config.ia.modelo || 'claude-opus-5-5',
      max_tokens: 50,
      output_config: { effort: 'low' },
      messages: [{ role: 'user', content: 'Responda apenas: ok' }],
    });
    O.log('ia', 'Conexão com o Claude testada com sucesso.');
    return resp;
  }

  return { disponivel, analisar, testar };
})();

  function situacao(l) {
    if (l.status === 'pago') return 'pago';
    const h = U.hoje();
    if (l.vencimento < h) return 'atrasado';
    if (l.vencimento === h) return 'hoje';
    return 'pendente';
  }

  function doMes(ym, f = {}) {
    const busca = U.normalizar(f.busca || '');
    return st().lancamentos.filter((l) => {
      if (U.mesDe(l.data) !== ym) return false;
      if (f.conta && f.conta !== 'todas' && l.conta !== f.conta) return false;
      if (f.tipo && f.tipo !== 'todos' && l.tipo !== f.tipo) return false;
      if (f.categoriaId && f.categoriaId !== 'todas' && l.categoriaId !== f.categoriaId) return false;
      if (f.situacao && f.situacao !== 'todas') {
        const s = situacao(l);
        if (f.situacao === 'aberto' ? s === 'pago' : s !== f.situacao) return false;
      }
      if (busca && !U.normalizar(`${l.descricao} ${l.notas} ${FC.store.categoria(l.categoriaId).nome}`).includes(busca)) return false;
      return true;
    }).sort((a, b) => (a.data < b.data ? 1 : a.data > b.data ? -1 : 0));
  }

  function totais(ym, conta) {
    const lista = doMes(ym, { conta });
    const t = { receitas: 0, despesas: 0, pago: 0, aPagar: 0, atrasado: 0, n: lista.length };
    lista.forEach((l) => {
      if (l.tipo === 'receita') t.receitas += l.valor;
      else {
        t.despesas += l.valor;
        const s = situacao(l);
        if (s === 'pago') t.pago += l.valor; else t.aPagar += l.valor;
        if (s === 'atrasado') t.atrasado += l.valor;
      }
    });
    t.saldo = t.receitas - t.despesas;
    return t;
  }

  function normalizar(d) {
    const l = Object.assign({
      id: U.uid(), tipo: 'despesa', conta: 'casal', pagoPor: 'a', status: 'pendente', pagoEm: '',
      forma: 'pix', recorrente: false, origem: 'manual', notas: '', categoriaId: 'outros',
    }, d);
    l.valor = Math.round(U.parseValor(l.valor) * 100) / 100;
    l.vencimento = l.vencimento || l.data;
    if (l.conta !== 'casal') l.pagoPor = l.conta;
    if (l.status === 'pago' && !l.pagoEm) l.pagoEm = U.hoje();
    delete l.duplicado; delete l.texto; delete l.motivo; delete l.confiancaExtracao;
    return l;
  }

  function adicionar(d, { silencioso = false } = {}) {
    const base = normalizar(d);
    const novos = [];
    if (base.parcela && base.parcela.total > 1 && !d.id) {
      // cria as parcelas restantes nos meses seguintes
      const desc = base.descricao.replace(/\s*[—-]?\s*parcela\s*\d+\/\d+$/i, '');
      for (let n = base.parcela.n; n <= base.parcela.total; n++) {
        const k = n - base.parcela.n;
        const ym = U.somaMes(U.mesDe(base.data), k);
        novos.push(Object.assign({}, base, {
          id: U.uid(),
          descricao: `${desc} — parcela ${n}/${base.parcela.total}`,
          data: U.mesmoDiaNoMes(base.data, ym),
          vencimento: U.mesmoDiaNoMes(base.vencimento, U.somaMes(U.mesDe(base.vencimento), k)),
          parcela: { n, total: base.parcela.total },
          status: k === 0 ? base.status : 'pendente',
          pagoEm: k === 0 ? base.pagoEm : '',
        }));
      }
    } else novos.push(base);
    st().lancamentos.push(...novos);
    FC.store.salvar();
    if (!silencioso) O.log('tesoureiro', novos.length > 1
      ? `Lancei "${base.descricao}" em ${novos.length} parcelas de ${U.moeda(base.valor)}.`
      : `Lancei ${base.tipo === 'receita' ? 'receita' : 'despesa'} "${base.descricao}" de ${U.moeda(base.valor)} (${FC.store.nomeConta(base.conta)}).`);
    return novos;
  }

  function atualizar(id, d) {
    const l = st().lancamentos.find((x) => x.id === id);
    if (!l) return;
    const antes = l.categoriaId;
    Object.assign(l, normalizar(Object.assign({}, l, d)));
    if (d.categoriaId && d.categoriaId !== antes && l.origem !== 'manual') FC.agentes.classificador.aprender(l.descricao, d.categoriaId);
    FC.store.salvar();
    O.log('tesoureiro', `Atualizei "${l.descricao}".`);
  }

  function remover(id) {
    const i = st().lancamentos.findIndex((x) => x.id === id);
    if (i < 0) return;
    const [l] = st().lancamentos.splice(i, 1);
    FC.store.salvar();
    O.log('tesoureiro', `Removi "${l.descricao}" (${U.moeda(l.valor)}).`);
  }

  function alternarPago(id) {
    const l = st().lancamentos.find((x) => x.id === id);
    if (!l) return;
    l.status = l.status === 'pago' ? 'pendente' : 'pago';
    l.pagoEm = l.status === 'pago' ? U.hoje() : '';
    FC.store.salvar();
    O.log('tesoureiro', `"${l.descricao}" marcado como ${l.status === 'pago' ? 'pago' : 'em aberto'}.`);
  }

  function marcarPagos(ids) {
    let n = 0;
    st().lancamentos.forEach((l) => { if (ids.includes(l.id) && l.status !== 'pago') { l.status = 'pago'; l.pagoEm = U.hoje(); n++; } });
    FC.store.salvar();
    if (n) O.log('tesoureiro', `Marquei ${n} conta(s) como paga(s).`);
  }

  /* Copia as contas marcadas como recorrentes do mês anterior que ainda não existem no mês. */
  function gerarRecorrentes(ym) {
    const anterior = U.somaMes(ym, -1);
    const chave = (l) => `${U.normalizar(l.descricao)}|${l.conta}|${l.categoriaId}|${l.tipo}`;
    const existentes = new Set(st().lancamentos.filter((l) => U.mesDe(l.data) === ym).map(chave));
    const novos = st().lancamentos
      .filter((l) => l.recorrente && U.mesDe(l.data) === anterior && !existentes.has(chave(l)))
      .map((l) => Object.assign({}, l, {
        id: U.uid(),
        data: U.mesmoDiaNoMes(l.data, ym),
        vencimento: U.mesmoDiaNoMes(l.vencimento, ym),
        status: 'pendente', pagoEm: '', origem: 'recorrente',
      }));
    if (novos.length) {
      st().lancamentos.push(...novos);
      FC.store.salvar();
      O.log('tesoureiro', `Gerei ${novos.length} conta(s) recorrente(s) para ${U.mesLabel(ym)}.`);
    }
    return novos.length;
  }

  return { situacao, doMes, totais, adicionar, atualizar, remover, alternarPago, marcarPagos, gerarRecorrentes };
})();

/* Agente Planejador — orçamento por categoria, divisão da renda em reservas e metas. */
FC.agentes.planejador = (() => {
  const O = FC.orquestrador;
  const U = FC.util;
  const T = () => FC.agentes.tesoureiro;
  const st = () => FC.store.estado;
  O.registrar({
    id: 'planejador', nome: 'Planejador', sigla: 'PL',
    papel: 'Divide a renda entre essenciais, pessoal, reserva e metas; acompanha orçamentos e objetivos.',
  });

  const BALDES = [
    { id: 'essenciais', nome: 'Essenciais', desc: 'moradia, contas, mercado, saúde, transporte' },
    { id: 'pessoal', nome: 'Gastos pessoais', desc: 'lazer, restaurantes, compras, assinaturas' },
    { id: 'reserva', nome: 'Reserva e investimentos', desc: 'reserva de emergência e aportes' },
    { id: 'metas', nome: 'Metas', desc: 'casamento, viagem, apartamento' },
  ];

  function baldeDe(l) {
    if (l.categoriaId === 'investimentos') return 'reserva';
    const g = FC.store.categoria(l.categoriaId).grupo;
    return g === 'essenciais' || g === 'pessoal' || g === 'metas' ? g : 'pessoal';
  }

  function alocacao(ym, conta) {
    const t = T().totais(ym, conta);
    const renda = t.receitas;
    const real = { essenciais: 0, pessoal: 0, reserva: 0, metas: 0 };
    T().doMes(ym, { conta, tipo: 'despesa' }).forEach((l) => { real[baldeDe(l)] += l.valor; });
    const pct = st().config.alocacao;
    return BALDES.map((b) => ({
      ...b,
      pctPlano: pct[b.id],
      plano: renda * pct[b.id] / 100,
      real: real[b.id],
      pctReal: renda ? real[b.id] / renda * 100 : 0,
    })).concat([{ id: 'sobra', nome: 'Sobra do mês', real: Math.max(0, renda - t.despesas), pctReal: renda ? Math.max(0, renda - t.despesas) / renda * 100 : 0 }]);
  }

  function orcamentos(ym) {
    const gastos = {};
    T().doMes(ym, { tipo: 'despesa' }).forEach((l) => { gastos[l.categoriaId] = (gastos[l.categoriaId] || 0) + l.valor; });
    return st().categorias.filter((c) => c.grupo !== 'receita').map((c) => ({
      ...c, gasto: gastos[c.id] || 0, pct: c.orcamento ? (gastos[c.id] || 0) / c.orcamento * 100 : 0,
    }));
  }

  function mediaEssenciais(ym, meses = 3) {
    let soma = 0;
    for (let i = 1; i <= meses; i++) {
      T().doMes(U.somaMes(ym, -i), { tipo: 'despesa' }).forEach((l) => { if (baldeDe(l) === 'essenciais') soma += l.valor; });
    }
    return soma / meses;
  }

  function reserva(ym) {
    const meta = st().metas.find((m) => m.id === 'reserva') || { guardado: 0 };
    const custo = mediaEssenciais(ym) || T().totais(ym).despesas;
    const alvo = custo * st().config.reservaMeses;
    return { guardado: meta.guardado, alvo, custoMensal: custo, meses: custo ? meta.guardado / custo : 0, pct: alvo ? Math.min(100, meta.guardado / alvo * 100) : 0 };
  }

  function metas() {
    const h = U.hoje();
    return st().metas.map((m) => {
      const alvo = m.especial ? reserva(U.mesDe(h)).alvo : m.alvo;
      const falta = Math.max(0, alvo - m.guardado);
      const meses = m.prazo ? Math.max(1, Math.ceil(U.diasEntre(h, m.prazo) / 30.44)) : 0;
      return { ...m, alvo, falta, meses, porMes: meses ? falta / meses : 0, pct: alvo ? Math.min(100, m.guardado / alvo * 100) : 0 };
    });
  }

  function salvarAlocacao(novo) {
    const soma = Object.values(novo).reduce((a, b) => a + Number(b), 0);
    if (Math.round(soma) !== 100) return `A soma precisa dar 100% (está em ${soma}%).`;
    st().config.alocacao = Object.fromEntries(Object.entries(novo).map(([k, v]) => [k, Number(v)]));
    FC.store.salvar();
    O.log('planejador', `Nova divisão da renda: ${BALDES.map((b) => `${b.nome} ${novo[b.id]}%`).join(', ')}.`);
    return null;
  }

  function aportar(metaId, valor, lancar, conta) {
    const m = st().metas.find((x) => x.id === metaId);
    if (!m) return;
    m.guardado = Math.round((m.guardado + valor) * 100) / 100;
    if (lancar && valor > 0) {
      T().adicionar({
        descricao: `Aporte — ${m.nome}`, valor, data: U.hoje(), categoriaId: 'investimentos',
        conta, status: 'pago', forma: 'pix', origem: 'manual',
      }, { silencioso: true });
    }
    FC.store.salvar();
    O.log('planejador', `${valor >= 0 ? 'Aporte' : 'Retirada'} de ${U.moeda(Math.abs(valor))} em "${m.nome}" — agora ${U.moeda(m.guardado)}.`);
  }

  return { BALDES, baldeDe, alocacao, orcamentos, reserva, metas, salvarAlocacao, aportar, mediaEssenciais };
})();
