          </div>
          ${ia ? '' : '<p class="aviso-caixa mt">O Analista IA está desligado. Os documentos são lidos localmente pelo Extrator. Para ler fotos e PDFs digitalizados com mais precisão, coloque sua chave da API do Claude em <a href="#" data-acao="ir" data-aba="ajustes">Ajustes</a>.</p>'}
          <details class="mt"><summary class="muted" style="cursor:pointer">Colar texto (SMS do banco, notificação, e-mail)</summary>
            <textarea id="imp-texto" rows="4" class="mt" style="width:100%;border:var(--borda);border-radius:7px;padding:8px" placeholder="Ex.: Compra aprovada no cartão final 1234: R$ 54,90 em IFOOD em 03/11/2026"></textarea>
            <button class="btn mt" data-acao="importar-texto">Ler texto</button>
          </details>
          <p class="muted mt" style="font-size:12px">Extrato em planilha? Use colunas Data; Descrição; Valor (negativo = saída). <a href="#" data-acao="modelo-csv">Baixar modelo</a>.</p>
        </section>

        <section class="cartao">
          <header><h3>Linha de montagem</h3><span class="sub" id="pipe-arq">${ctx.processando ? 'processando…' : 'aguardando arquivos'}</span></header>
          <div class="pipeline" id="pipeline">${etapas.map(([id, s, n], i) => `${i ? '<span class="seta"></span>' : ''}<span class="etapa" data-etapa="${id}"><span class="sig">${s}</span>${n}</span>`).join('')}</div>
          <p class="muted" style="font-size:12.5px;margin:10px 0 0">O Leitor abre o arquivo, o Extrator (ou o Analista IA) encontra valor, datas e estabelecimento, o Classificador escolhe a categoria e a Sentinela confere se já não foi lançado. Nada entra no caixa sem a sua revisão.</p>
        </section>
      </div>

      <section class="cartao">
        <header><h3>Revisão</h3><span class="sub">${r.length ? `${r.length} item(ns) — confira e ajuste antes de lançar` : 'os itens lidos aparecem aqui'}</span>
          ${r.length ? '<button class="btn" data-acao="descartar-rascunhos">Descartar</button><button class="btn btn-p" data-acao="lancar-rascunhos">Lançar selecionados</button>' : ''}</header>
        ${r.length ? `<div class="tabela-envolve"><table class="tabela">
          <thead><tr><th style="width:28px"></th><th>Arquivo</th><th>Descrição</th><th>Categoria</th><th>Conta</th><th>Data</th><th>Status</th><th>Tipo</th><th class="num">Valor</th></tr></thead>
          <tbody>${r.map((x, i) => `<tr data-i="${i}" ${x.interno ? 'style="opacity:.6"' : ''}>
            <td><input type="checkbox" class="r-incluir" ${x.duplicado || x.interno ? '' : 'checked'}></td>
            <td style="max-width:160px"><span class="muted" style="font-size:12px;word-break:break-all">${e(x.arquivo || 'texto colado')}</span><br><span class="etq ${x.origem === 'ia' ? 'etq-ia' : ''}">${e(x.docTipo || '')}</span>${x.duplicado ? '<br><span class="st st-atrasado" style="cursor:default">já lançado?</span>' : ''}${x.interno ? '<br><span class="etq">entre contas</span>' : ''}</td>
            <td><input class="r-desc" value="${e(x.descricao)}" style="width:100%;min-width:150px"><br><span class="conf ${x.confiancaExtracao < 0.5 ? 'baixa' : ''}" title="Confiança na leitura"><i style="--c:${Math.round((x.confiancaExtracao || 0) * 100)}%"></i>leitura ${Math.round((x.confiancaExtracao || 0) * 100)}%</span>${x.linhaDigitavel ? ' <span class="etq">boleto</span>' : ''}${x.parcela ? ` <span class="etq">${x.parcela.n}/${x.parcela.total}</span>` : ''}</td>
            <td><select class="r-cat">${opcoesCategorias(x.categoriaId)}</select><br><span class="conf ${x.confianca < 0.5 ? 'baixa' : ''}" title="${e(x.motivo || '')}"><i style="--c:${Math.round((x.confianca || 0) * 100)}%"></i>${e(x.motivo || '')}</span></td>
            <td><select class="r-conta">${opcoesContas(x.conta)}</select></td>
            <td><input type="date" class="r-venc" value="${x.vencimento}"></td>
            <td><select class="r-status"><option value="pendente" ${x.status !== 'pago' ? 'selected' : ''}>a pagar</option><option value="pago" ${x.status === 'pago' ? 'selected' : ''}>pago</option></select></td>
            <td><select class="r-tipo"><option value="despesa" ${x.tipo !== 'receita' ? 'selected' : ''}>saída</option><option value="receita" ${x.tipo === 'receita' ? 'selected' : ''}>entrada</option></select></td>
            <td class="num"><input class="r-valor" value="${x.valor.toFixed(2).replace('.', ',')}" style="width:100px;text-align:right"></td>
          </tr>`).join('')}</tbody></table></div>` : '<p class="vazio">Envie um arquivo para começar. Dica: boletos em PDF já trazem valor e vencimento na linha digitável.</p>'}
      </section>`;
    return { html };
  }

  /* =============== ORÇAMENTO E RESERVAS =============== */
  function orcamento(ctx) {
    const aloc = A.planejador.alocacao(ctx.ym);
    const renda = A.tesoureiro.totais(ctx.ym).receitas;
    const orc = A.planejador.orcamentos(ctx.ym);
    const cores = G.SERIES;
    const totalOrc = orc.reduce((s, c) => s + (c.orcamento || 0), 0);
    const totalGasto = orc.reduce((s, c) => s + c.gasto, 0);
    const grupos = { essenciais: 'Essenciais', pessoal: 'Pessoais', metas: 'Metas' };
    const html = `
      <section class="cartao">
        <header><h3>Divisão da renda</h3><span class="sub">renda de ${U.mesLabel(ctx.ym)}: ${U.moeda(renda)}</span>
          <span id="soma-aloc" class="etq">soma 100%</span><button class="btn btn-p" data-acao="salvar-alocacao">Salvar divisão</button></header>
        <div class="alocacao">${aloc.filter((b) => b.id !== 'sobra').map((b, i) => `
          <div class="balde">
            <div class="topo-b"><i style="background:${cores[i]}"></i>${e(b.nome)}</div>
            <small>${e(b.desc)}</small>
            <div class="pct-in"><input type="number" min="0" max="100" step="1" value="${b.pctPlano}" data-balde="${b.id}"> % da renda</div>
            <div class="linha"><span>Planejado</span><b>${U.moeda(b.plano)}</b></div>
            <div class="linha"><span>Realizado</span><b>${U.moeda(b.real)}</b></div>
            ${G.progresso(b.plano ? b.real / b.plano * 100 : 0, b.id === 'reserva' || b.id === 'metas' ? 'meta' : undefined)}
            <small>${b.id === 'reserva' || b.id === 'metas'
              ? (b.real >= b.plano ? 'meta do mês cumprida' : `faltam ${U.moeda(b.plano - b.real)} para a meta`)
              : (b.real > b.plano ? `${U.moeda(b.real - b.plano)} acima do planejado` : `sobram ${U.moeda(b.plano - b.real)}`)}</small>
          </div>`).join('')}</div>
        <p class="muted mt" style="font-size:12.5px">Sugestão clássica: 50% essenciais, 20–30% pessoais, o resto para reserva e metas. Enquanto a reserva de emergência não estiver completa, vale mandar a fatia de metas para ela também.</p>
      </section>

      <section class="cartao">
        <header><h3>Orçamento por categoria</h3><span class="sub">${U.moeda(totalGasto)} de ${U.moeda(totalOrc)} previstos</span><button class="btn btn-p" data-acao="salvar-orcamentos">Salvar orçamentos</button></header>
        ${Object.entries(grupos).map(([g, nome]) => `
          <h4 class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin:10px 0 2px">${nome}</h4>
          ${orc.filter((c) => c.grupo === g).map((c) => `<div class="orc-linha">
            <span>${e(c.nome)}</span>
            <input type="number" min="0" step="10" value="${c.orcamento || 0}" data-orc="${c.id}" aria-label="Orçamento de ${e(c.nome)}">
            <span>${G.progresso(c.pct)}<small class="muted">${c.orcamento ? `${Math.round(c.pct)}% usado` : 'sem limite'}</small></span>
            <span class="num"><b>${U.moeda(c.gasto)}</b></span>
          </div>`).join('')}`).join('')}
      </section>`;
    return { html };
  }

  /* =============== CASAL =============== */
  function casal(ctx) {
    const a = A.divisor.acerto(ctx.ym);
    const d = st().config.divisao;
    const p = pessoas();
    const hist = A.divisor.historico(6, ctx.ym);
    const html = `
      <section class="cartao">
        <header><h3>Como dividimos a conta conjunta</h3></header>
        <div class="linha-acoes">
          <div class="segmentado" role="group">
            ${[['igual', 'Meio a meio'], ['proporcional', 'Proporcional à renda'], ['custom', 'Personalizado']].map(([v, n]) => `<button data-acao="modo-divisao" data-modo="${v}" class="${d.modo === v ? 'ativo' : ''}">${n}</button>`).join('')}
          </div>
          ${d.modo === 'custom' ? `<label class="campo" style="flex-direction:row;align-items:center;gap:8px">${e(p.a)} paga <input type="number" min="0" max="100" value="${d.pctA}" id="pct-a" style="width:70px"> %</label><button class="btn" data-acao="salvar-pct">Aplicar</button>` : ''}
          <span class="muted">${e(p.a)} ${Math.round(a.pctA)}% · ${e(p.b)} ${Math.round(a.pctB)}%${d.modo === 'proporcional' ? ' (calculado pela renda do mês)' : ''}</span>
        </div>
      </section>

      <section class="cartao">
        <header><h3>Acerto de ${U.mesLabel(ctx.ym)}</h3><span class="sub">considera só despesas conjuntas já pagas</span></header>
        <div class="acerto">
          <div class="pessoa"><h4>${e(p.a)}</h4>
            <div class="linha"><span>Pagou</span><b>${U.moeda(a.pagoA)}</b></div>
            <div class="linha"><span>Deveria pagar (${Math.round(a.pctA)}%)</span><b>${U.moeda(a.devidoA)}</b></div>
            <div class="linha"><span>Diferença</span><b class="${a.pagoA - a.devidoA < 0 ? 'neg' : ''}">${U.moeda(a.pagoA - a.devidoA)}</b></div>
          </div>
          <div class="seta-acerto">
            ${Math.abs(a.saldoA) < 1 ? '<b>Quites</b>contas equilibradas' : `<span class="flecha">${a.saldoA > 0 ? '←' : '→'}</span><b>${U.moeda(Math.abs(a.saldoA))}</b>${e(A.divisor.frase(a))}`}
            ${a.acertado ? `<div class="muted" style="font-size:12px;margin-top:4px">já acertado: ${U.moeda(Math.abs(a.acertado))}</div>` : ''}
            ${Math.abs(a.saldoA) >= 1 ? '<div class="mt"><button class="btn btn-m" data-acao="registrar-acerto">Registrar acerto</button></div>' : ''}
          </div>
          <div class="pessoa"><h4>${e(p.b)}</h4>
            <div class="linha"><span>Pagou</span><b>${U.moeda(a.pagoB)}</b></div>
            <div class="linha"><span>Deveria pagar (${Math.round(a.pctB)}%)</span><b>${U.moeda(a.devidoB)}</b></div>
            <div class="linha"><span>Diferença</span><b class="${a.pagoB - a.devidoB < 0 ? 'neg' : ''}">${U.moeda(a.pagoB - a.devidoB)}</b></div>
          </div>
        </div>
      </section>

      <div class="grade-21">
        <section class="cartao"><header><h3>Despesas conjuntas do mês</h3><span class="sub">${a.itens.length} itens · ajuste quem pagou</span></header>
          <div class="tabela-envolve"><table class="tabela"><thead><tr><th>Data</th><th>Descrição</th><th>Status</th><th>Quem pagou</th><th class="num">Valor</th></tr></thead><tbody>
          ${a.itens.map((l) => `<tr><td>${U.dataCurta(l.data)}</td><td class="desc">${e(l.descricao)}<small>${e(cat(l.categoriaId).nome)}</small></td><td>${pill(l)}</td>
            <td><select data-acao-change="pago-por" data-id="${l.id}"><option value="a" ${l.pagoPor === 'a' ? 'selected' : ''}>${e(p.a)}</option><option value="b" ${l.pagoPor === 'b' ? 'selected' : ''}>${e(p.b)}</option></select></td>
            <td class="num">${U.moeda(l.valor)}</td></tr>`).join('') || '<tr><td colspan="5" class="vazio">Sem despesas conjuntas neste mês.</td></tr>'}
          </tbody></table></div>
        </section>
        <section class="cartao"><header><h3>Últimos meses</h3></header>
          <table class="tabela"><thead><tr><th>Mês</th><th class="num">Conjunto</th><th class="num">Saldo</th></tr></thead><tbody>
          ${hist.map((m) => `<tr><td style="text-transform:capitalize">${U.mesCurto(m.ym)}</td><td class="num">${U.moeda(m.total)}</td><td class="num">${Math.abs(m.saldoA) < 1 ? '<span class="muted">quites</span>' : `${m.saldoA > 0 ? e(p.b) + ' → ' + e(p.a) : e(p.a) + ' → ' + e(p.b)}<br><b>${U.moeda(Math.abs(m.saldoA))}</b>`}</td></tr>`).join('')}
          </tbody></table>
        </section>
      </div>`;
    return { html };
  }

  /* =============== METAS =============== */
  function metas() {
    const ms = A.planejador.metas();
    const res = A.planejador.reserva(U.mesDe(U.hoje()));
    const html = `
      <section class="cartao">
        <header><h3>Reserva de emergência</h3><span class="sub">custo essencial médio: ${U.moeda(res.custoMensal)}/mês</span>
          <label class="campo" style="flex-direction:row;align-items:center;gap:8px">Meses de proteção <input type="number" min="1" max="24" value="${st().config.reservaMeses}" id="reserva-meses" style="width:64px"></label></header>
        <div class="grade-2">
          <div>
            <div style="display:flex;align-items:baseline;gap:10px"><span style="font-family:var(--fonte-titulo);font-size:30px">${U.moeda(res.guardado)}</span><span class="muted">de ${U.moeda(res.alvo)}</span></div>
            ${G.progresso(res.pct, 'meta')}
            <p class="muted" style="font-size:12.5px">Cobre <b>${res.meses.toFixed(1)} meses</b> de despesas essenciais. ${res.pct >= 100 ? 'Reserva completa — o excedente pode ir para as metas.' : `Faltam ${U.moeda(res.alvo - res.guardado)}.`}</p>
          </div>
          <div class="aviso-caixa"><b>Onde guardar:</b> algo com liquidez diária e baixo risco (Tesouro Selic, CDB com liquidez diária, conta remunerada). A reserva é para imprevistos — não para o casamento ou para a viagem.</div>
        </div>
        <div class="linha-acoes mt"><button class="btn btn-p" data-acao="aportar" data-id="reserva">Aportar na reserva</button><button class="btn" data-acao="retirar" data-id="reserva">Registrar retirada</button></div>
      </section>
      <section>
        <div class="linha-acoes" style="margin-bottom:12px"><h3 style="font-size:19px;margin-right:auto">Metas do casal</h3><button class="btn btn-p" data-acao="nova-meta">Nova meta</button></div>
        <div class="metas">${ms.filter((m) => !m.especial).map((m) => `
          <article class="meta">
            <h4>${e(m.nome)} <small>${m.prazo ? 'até ' + U.dataBR(m.prazo) : 'sem prazo'}</small></h4>
            <div class="valores"><b>${U.moeda(m.guardado)}</b><span>de ${U.moeda(m.alvo)}</span></div>
            ${G.progresso(m.pct, 'meta')}
            <div class="nota">${m.falta <= 0 ? 'Meta alcançada!' : m.meses ? `Guardem <b>${U.moeda(m.porMes)}/mês</b> por ${m.meses} meses para chegar lá.` : `Faltam ${U.moeda(m.falta)}.`}</div>
            <footer><button class="btn btn-pq btn-p" data-acao="aportar" data-id="${m.id}">Aportar</button><button class="btn btn-pq" data-acao="editar-meta" data-id="${m.id}">Editar</button><button class="btn btn-pq btn-l btn-perigo" data-acao="excluir-meta" data-id="${m.id}">Excluir</button></footer>
          </article>`).join('') || '<p class="vazio">Nenhuma meta ainda.</p>'}</div>
      </section>`;
    return { html };
  }

  /* =============== RELATÓRIOS =============== */
  function relatorios(ctx) {
    const conta = contaFiltro(ctx.conta);
    const serie = A.analista.serie(ctx.ym, 12, conta);
    const obs = A.analista.observacoes(ctx.ym, conta);
    const est = A.analista.porEstabelecimento(ctx.ym, conta, 8);
    const ano = serie.reduce((s, m) => ({ r: s.r + m.receitas, d: s.d + m.despesas }), { r: 0, d: 0 });
    const html = `
      <div class="linha-acoes"><button class="btn" data-acao="baixar-resumo">Baixar resumo (.txt)</button><button class="btn" data-acao="exportar-ano">Exportar 12 meses (CSV)</button><button class="btn" data-acao="imprimir">Imprimir / salvar PDF</button></div>
      <section class="cartao"><header><h3>Evolução mensal</h3><span class="sub">12 meses: receitas ${U.moeda(ano.r)} · despesas ${U.moeda(ano.d)} · guardado ${U.moeda(ano.r - ano.d)}</span></header><div id="g-linhas"></div></section>
      <div class="grade-2">
        <section class="cartao"><header><h3>O que o Analista observou</h3><span class="sub" style="text-transform:capitalize">${U.mesLabel(ctx.ym)}</span></header><ul class="obs">${obs.map((o) => `<li>${e(o)}</li>`).join('')}</ul></section>
        <section class="cartao"><header><h3>Despesas por categoria</h3></header><div id="g-cat"></div></section>
      </div>
      <div class="grade-2">
        <section class="cartao"><header><h3>Onde mais gastamos</h3></header>
          <table class="tabela"><thead><tr><th>Estabelecimento</th><th class="num">Vezes</th><th class="num">Total</th></tr></thead><tbody>
          ${est.map((x) => `<tr><td>${e(x.nome)}</td><td class="num">${x.vezes}</td><td class="num">${U.moeda(x.valor)}</td></tr>`).join('')}</tbody></table>
        </section>
        <section class="cartao"><header><h3>Tabela mensal</h3></header>
          <table class="tabela"><thead><tr><th>Mês</th><th class="num">Receitas</th><th class="num">Despesas</th><th class="num">Saldo</th></tr></thead><tbody>
          ${serie.slice().reverse().map((m) => `<tr><td style="text-transform:capitalize">${U.mesCurto(m.ym)}</td><td class="num">${U.moeda(m.receitas)}</td><td class="num">${U.moeda(m.despesas)}</td><td class="num ${m.saldo < 0 ? 'neg' : ''}">${U.moeda(m.saldo)}</td></tr>`).join('')}</tbody></table>
        </section>
      </div>`;
    const depois = () => {
      G.linhas(document.getElementById('g-linhas'), serie, [
        { chave: 'receitas', nome: 'Receitas', cor: G.SERIES[0] },
        { chave: 'despesas', nome: 'Despesas', cor: G.SERIES[1] },
      ]);
      G.barras(document.getElementById('g-cat'), A.analista.porCategoria(ctx.ym, conta), { max: 12, mostrarOrcamento: false });
    };
    return { html, depois };
  }

  /* =============== CATEGORIAS =============== */
  function categorias() {
    const usos = {};
    st().lancamentos.forEach((l) => { usos[l.categoriaId] = (usos[l.categoriaId] || 0) + 1; });
    const grupos = [['essenciais', 'Essencial'], ['pessoal', 'Pessoal'], ['metas', 'Metas / investimento'], ['receita', 'Receita']];
    const html = `
      <div class="grade-21">
        <section class="cartao"><header><h3>Categorias</h3><span class="sub">${st().categorias.length} categorias</span><button class="btn btn-p" data-acao="salvar-categorias">Salvar alterações</button></header>
          <div class="tabela-envolve"><table class="tabela"><thead><tr><th>Nome</th><th>Grupo</th><th class="num">Orçamento/mês</th><th class="num">Lançamentos</th><th></th></tr></thead><tbody>
          ${st().categorias.map((c) => `<tr data-cat="${c.id}">
            <td><input class="c-nome" value="${e(c.nome)}" style="width:100%"></td>
            <td><select class="c-grupo">${grupos.map(([v, n]) => `<option value="${v}" ${c.grupo === v ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
            <td class="num"><input class="c-orc" type="number" min="0" step="10" value="${c.orcamento || 0}" style="width:100px;text-align:right" ${c.grupo === 'receita' ? 'disabled' : ''}></td>
            <td class="num">${usos[c.id] || 0}</td>
            <td class="acoes">${c.id === 'outros' ? '' : `<button class="btn btn-l btn-pq btn-perigo" data-acao="excluir-categoria" data-id="${c.id}">excluir</button>`}</td>
          </tr>`).join('')}</tbody></table></div>
        </section>
        <div style="display:flex;flex-direction:column;gap:20px">
          <section class="cartao"><header><h3>Nova categoria</h3></header>
            <div class="grade-campos">
              <label class="campo inteiro">Nome<input id="nova-cat-nome" placeholder="Ex.: Chá de panela"></label>
              <label class="campo">Grupo<select id="nova-cat-grupo">${grupos.map(([v, n]) => `<option value="${v}">${n}</option>`).join('')}</select></label>
              <label class="campo">Orçamento/mês<input id="nova-cat-orc" type="number" min="0" step="10" value="0"></label>
            </div>
            <button class="btn btn-p mt" data-acao="criar-categoria">Adicionar</button>
          </section>
          <section class="cartao"><header><h3>O que o Classificador aprendeu</h3><span class="sub">${st().regras.length} regra(s)</span></header>
            ${st().regras.length ? `<table class="tabela"><tbody>${st().regras.map((g, i) => `<tr><td>“${e(g.padrao)}”</td><td>→ ${e(cat(g.categoriaId).nome)}</td><td class="acoes"><button class="btn btn-l btn-pq" data-acao="esquecer-regra" data-i="${i}">esquecer</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">Quando você corrigir a categoria de um item importado, o Classificador guarda a regra aqui.</p>'}
          </section>
        </div>
      </div>`;
    return { html };
  }

  /* =============== AGENTES =============== */
  function agentes(ctx) {
    const lista = Object.values(FC.orquestrador.agentes);
    const nomes = Object.fromEntries(lista.map((a) => [a.id, a.nome]));
    const filtro = ctx.filtroAgente || 'todos';
    const diario = st().diario.filter((d) => filtro === 'todos' || d.agente === filtro).slice(0, 120);
    const html = `
      <section class="cartao"><header><h3>Equipe</h3><span class="sub">cada agente cuida de uma parte do controle</span>
        <button class="btn" data-acao="varredura">Rodar varredura</button><button class="btn" data-acao="gerar-recorrentes">Gerar recorrentes</button></header>
        <div class="agentes">${lista.map((a) => {
          const desligado = a.id === 'ia' && !A.ia.disponivel();
          return `<article class="agente ${a.status} ${desligado ? 'desligado' : ''}" data-agente="${a.id}">
            <header><span class="sig">${a.sigla}</span><h4>${e(a.nome)}</h4><span class="estado">${desligado ? 'sem chave' : a.status}</span></header>
            <p>${e(a.papel)}</p>
            <div class="ult">${(() => { const u = a.ultimaAcao || (st().diario.find((d) => d.agente === a.id) || {}).mensagem; return u ? e(u) : 'Ainda não trabalhou.'; })()}</div>
          </article>`;
        }).join('')}</div>
      </section>
      <section class="cartao"><header><h3>Diário de bordo</h3>
        <select data-acao-change="filtro-agente"><option value="todos">Todos os agentes</option>${lista.map((a) => `<option value="${a.id}" ${filtro === a.id ? 'selected' : ''}>${e(a.nome)}</option>`).join('')}</select>
        <button class="btn btn-l" data-acao="limpar-diario">limpar</button></header>
        ${diario.length ? `<ul class="diario">${diario.map((d) => {
          const dt = new Date(d.em);
          return `<li class="${d.nivel}"><time>${String(dt.getDate()).padStart(2, '0')}/${String(dt.getMonth() + 1).padStart(2, '0')} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}</time><span class="quem">${e(nomes[d.agente] || d.agente)}</span><span class="msg">${e(d.mensagem)}</span></li>`;
        }).join('')}</ul>` : '<p class="vazio">Nada registrado ainda.</p>'}
      </section>`;
    return { html };
  }

  /* =============== AJUSTES =============== */
  function ajustes() {
    const c = st().config;
    const html = `
      <div class="grade-2">
        <section class="cartao"><header><h3>Pessoas</h3></header>
          <div class="grade-campos">
            <label class="campo">Você<input id="aj-a" value="${e(c.pessoas.a)}"></label>
            <label class="campo">Sua noiva<input id="aj-b" value="${e(c.pessoas.b)}"></label>
          </div>
          <button class="btn btn-p mt" data-acao="salvar-pessoas">Salvar nomes</button>
        </section>
        <section class="cartao"><header><h3>Analista IA (Claude)</h3><span class="sub">${A.ia.disponivel() ? 'ligado' : 'desligado'}</span></header>
          <div class="grade-campos">
            <label class="campo inteiro">Chave da API Anthropic<input id="aj-chave" type="password" placeholder="sk-ant-…" value="${e(c.ia.apiKey)}" autocomplete="off"></label>
            <label class="campo">Modelo<select id="aj-modelo">${[['claude-opus-5-5', 'Claude Opus 5.5 (mais preciso)'], ['claude-sonnet-5-5', 'Claude Sonnet 5.5 (equilíbrio)'], ['claude-haiku-5-5', 'Claude Haiku 5.5 (mais barato)']].map(([v, n]) => `<option value="${v}" ${c.ia.modelo === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
            <label class="campo">&nbsp;<span class="check"><input type="checkbox" id="aj-sempre" ${c.ia.sempre ? 'checked' : ''}> Usar IA em todo documento</span></label>
          </div>
          <p class="aviso-caixa mt">A chave fica salva só neste navegador e nunca vai para o backup. O documento é enviado direto do seu navegador para a API da Anthropic. Sem chave, tudo funciona localmente com o Extrator.</p>
          <div class="linha-acoes mt"><button class="btn btn-p" data-acao="salvar-ia">Salvar</button><button class="btn" data-acao="testar-ia">Testar conexão</button></div>
        </section>
      </div>
      <div class="grade-2">
        <section class="cartao"><header><h3>Leitura de fotos sem IA</h3></header>
          <label class="check"><input type="checkbox" id="aj-ocr" data-acao-change="ocr" ${c.ocr ? 'checked' : ''}> Ativar OCR local (Tesseract) para fotos de cupom quando a IA estiver desligada</label>
          <p class="muted" style="font-size:12.5px">Baixa ~10 MB na primeira vez e roda no seu navegador. É mais lento e menos preciso que a IA, mas não envia nada para fora.</p>
        </section>
        <section class="cartao"><header><h3>Backup e dados</h3></header>
          <div class="linha-acoes">
            <button class="btn btn-p" data-acao="backup">Baixar backup (JSON)</button>
            <label class="btn">Restaurar backup<input type="file" accept=".json" id="restaurar" hidden></label>
            <button class="btn" data-acao="exportar-tudo">Exportar tudo (CSV)</button>
          </div>
          <p class="muted mt" style="font-size:12.5px">Seus dados ficam guardados no navegador deste aparelho. Faça backup de vez em quando — e para usar em outro aparelho, restaure o arquivo lá.</p>
          <div class="linha-acoes mt"><button class="btn" data-acao="carregar-exemplo">Recarregar dados de exemplo</button><button class="btn btn-perigo" data-acao="zerar">Começar do zero</button></div>
          ${st().demo ? '<p class="aviso-caixa mt"><b>Você está vendo dados de exemplo.</b> Quando quiser usar de verdade, clique em “Começar do zero” (categorias e ajustes são mantidos).</p>' : ''}
        </section>
      </div>`;
    return { html };
  }

  return { visao, lancamentos, pagar, importar, orcamento, casal, metas, relatorios, categorias, agentes, ajustes, opcoesCategorias, opcoesContas };
})();

</script>
  <script>
/* Casca do aplicativo: navegação, cabeçalho, ações, formulários e importação. */
(() => {
  const U = FC.util;
  const A = FC.agentes;
  const O = FC.orquestrador;
  const T = FC.telas;
  const st = () => FC.store.estado;

  const ABAS = [
    { id: 'visao', nome: 'Visão geral', grupo: 'Dia a dia', sub: 'resumo do mês', ic: '<path d="M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z"/>' },
    { id: 'lancamentos', nome: 'Lançamentos', grupo: 'Dia a dia', sub: 'tudo que entrou e saiu', ic: '<path d="M4 6h16M4 12h16M4 18h10"/>' },
    { id: 'pagar', nome: 'Contas a pagar', grupo: 'Dia a dia', sub: 'vencimentos e pagamentos', ic: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>' },
    { id: 'importar', nome: 'Importar recibos', grupo: 'Dia a dia', sub: 'PDF, foto, boleto, extrato', ic: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>' },
    { id: 'orcamento', nome: 'Orçamento e reservas', grupo: 'Planejamento', sub: 'divisão da renda e limites', ic: '<circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 6"/>' },
    { id: 'casal', nome: 'Conta do casal', grupo: 'Planejamento', sub: 'divisão e acerto entre vocês', ic: '<circle cx="9" cy="8" r="3.5"/><circle cx="16" cy="9" r="3"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M15 14.6c2.8.1 5 1.9 6.5 5.4"/>' },
    { id: 'metas', nome: 'Metas', grupo: 'Planejamento', sub: 'reserva de emergência e objetivos', ic: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>' },
    { id: 'relatorios', nome: 'Relatórios', grupo: 'Planejamento', sub: 'evolução e observações', ic: '<path d="M4 19l5-6 4 3 7-9"/><path d="M4 4v16h16"/>' },
    { id: 'categorias', nome: 'Categorias', grupo: 'Sistema', sub: 'grupos, limites e regras', ic: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>' },
    { id: 'agentes', nome: 'Agentes', grupo: 'Sistema', sub: 'quem faz o quê, e o diário', ic: '<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01"/>' },
    { id: 'ajustes', nome: 'Ajustes', grupo: 'Sistema', sub: 'pessoas, IA, backup', ic: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>' },
  ];

  const ui = {
    aba: (location.hash || '#visao').slice(1),
    ym: U.mesDe(U.hoje()),
    conta: 'todas',
    filtros: { tipo: 'todos', categoriaId: 'todas', situacao: 'todas', busca: '' },
    rascunhos: [],
    impConta: 'casal',
    processando: false,
    filtroAgente: 'todos',
  };
  if (!ABAS.some((a) => a.id === ui.aba)) ui.aba = 'visao';

  /* ---------- casca ---------- */
  function montarNav() {
    const atrasadas = st().lancamentos.filter((l) => l.tipo === 'despesa' && l.status !== 'pago' && l.vencimento < U.hoje()).length;
    let grupo = '';
    document.getElementById('nav').innerHTML = ABAS.map((a) => {
      const g = a.grupo !== grupo ? `<div class="nav-grupo">${a.grupo}</div>` : '';
      grupo = a.grupo;
      return `${g}<a href="#${a.id}" class="${ui.aba === a.id ? 'ativo' : ''}"><svg viewBox="0 0 24 24">${a.ic}</svg>${a.nome}${a.id === 'pagar' && atrasadas ? `<span class="contador">${atrasadas}</span>` : ''}</a>`;
    }).join('');
  }

  function montarTopo() {
    const aba = ABAS.find((a) => a.id === ui.aba);
    const comMes = ['visao', 'lancamentos', 'pagar', 'orcamento', 'casal', 'relatorios'].includes(ui.aba);
    const comConta = ['visao', 'lancamentos', 'pagar', 'relatorios'].includes(ui.aba);
    const p = st().config.pessoas;
    document.getElementById('topo').innerHTML = `
      <button class="btn btn-l menu-btn" data-acao="menu" aria-label="Menu">☰</button>
      <h2>${aba.nome}<small>${aba.sub}</small></h2>
      ${comConta ? `<div class="segmentado" role="group" aria-label="Conta">${[['todas', 'Tudo'], ['casal', 'Conjunta'], ['a', p.a], ['b', p.b]].map(([v, n]) => `<button data-acao="conta" data-conta="${v}" class="${ui.conta === v ? 'ativo' : ''}">${U.esc(n)}</button>`).join('')}</div>` : ''}
      ${comMes ? `<div class="seletor-mes"><button data-acao="mes" data-d="-1" aria-label="Mês anterior">‹</button><span>${U.mesLabel(ui.ym)}</span><button data-acao="mes" data-d="1" aria-label="Próximo mês">›</button></div>` : ''}
      <div class="linha-acoes"><button class="btn btn-p" data-acao="novo">+ Novo lançamento</button></div>`;
  }

  let telaAtual = null;
  function render() {
    montarNav();
    montarTopo();
    const tela = T[ui.aba](ui);
    telaAtual = tela;
    const c = document.getElementById('conteudo');
    c.innerHTML = tela.html;
    if (tela.depois) tela.depois();
    if (ui.aba === 'importar') ligarImportacao();
    if (ui.aba === 'orcamento') ligarAlocacao();
    document.title = `${ABAS.find((a) => a.id === ui.aba).nome} · Caderneta`;
  }

  let rTimer;
  O.on('mudou', () => { clearTimeout(rTimer); rTimer = setTimeout(render, 30); });
  O.on('agente-status', ({ agenteId, status }) => {
    const card = document.querySelector(`.agente[data-agente="${agenteId}"]`);
    if (card) { card.className = `agente ${status}`; card.querySelector('.estado').textContent = status; }
  });
  window.addEventListener('hashchange', () => { ui.aba = location.hash.slice(1) || 'visao'; if (!ABAS.some((a) => a.id === ui.aba)) ui.aba = 'visao'; document.querySelector('.app').classList.remove('menu-aberto'); render(); window.scrollTo(0, 0); });
  let wTimer;
  window.addEventListener('resize', () => { clearTimeout(wTimer); wTimer = setTimeout(() => telaAtual && telaAtual.depois && telaAtual.depois(), 150); });

  /* ---------- avisos ---------- */
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('mostra');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('mostra'), 2600);
  }

  /* ---------- modal genérico ---------- */
  function modal(titulo, corpo, botoes) {
    const fundo = document.createElement('div');
    fundo.className = 'fundo-modal';
    fundo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${U.esc(titulo)}"><header><h3>${U.esc(titulo)}</h3><button class="btn btn-l" data-fechar aria-label="Fechar">✕</button></header><div class="corpo">${corpo}</div><footer>${botoes}</footer></div>`;
    const fechar = () => fundo.remove();
    fundo.addEventListener('click', (ev) => { if (ev.target === fundo || ev.target.closest('[data-fechar]')) fechar(); });
    fundo.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') fechar(); });
    document.body.appendChild(fundo);
    const primeiro = fundo.querySelector('input, select, textarea');
    if (primeiro) primeiro.focus();
    return { el: fundo, fechar };
  }

  /* ---------- formulário de lançamento ---------- */
  function formLancamento(l) {
    const novo = !l;
    l = l || { tipo: 'despesa', data: ui.ym === U.mesDe(U.hoje()) ? U.hoje() : `${ui.ym}-01`, conta: ui.conta === 'todas' ? 'casal' : ui.conta, pagoPor: 'a', status: 'pendente', forma: 'pix', categoriaId: 'mercado', valor: '' };
    const p = st().config.pessoas;
    const m = modal(novo ? 'Novo lançamento' : 'Editar lançamento', `
      <div class="tipo-toggle"><label><input type="radio" name="tipo" value="despesa" ${l.tipo === 'despesa' ? 'checked' : ''}><span>Despesa</span></label><label><input type="radio" name="tipo" value="receita" ${l.tipo === 'receita' ? 'checked' : ''}><span>Receita</span></label></div>
      <div class="grade-campos">
        <label class="campo inteiro">Descrição<input name="descricao" value="${U.esc(l.descricao || '')}" placeholder="Ex.: Conta de luz" required></label>
        <label class="campo">Valor (R$)<input name="valor" inputmode="decimal" value="${l.valor !== '' ? String(l.valor).replace('.', ',') : ''}" placeholder="0,00" required></label>
        <label class="campo">Categoria<select name="categoriaId">${T.opcoesCategorias(l.categoriaId, l.tipo)}</select></label>
        <label class="campo">Data (competência)<input type="date" name="data" value="${l.data}"></label>
        <label class="campo">Vencimento<input type="date" name="vencimento" value="${l.vencimento || l.data}"></label>
        <label class="campo">Conta<select name="conta">${T.opcoesContas(l.conta)}</select></label>
        <label class="campo" id="campo-pagopor">Quem paga<select name="pagoPor"><option value="a" ${l.pagoPor === 'a' ? 'selected' : ''}>${U.esc(p.a)}</option><option value="b" ${l.pagoPor === 'b' ? 'selected' : ''}>${U.esc(p.b)}</option></select></label>
        <label class="campo">Status<select name="status"><option value="pendente" ${l.status !== 'pago' ? 'selected' : ''}>Em aberto</option><option value="pago" ${l.status === 'pago' ? 'selected' : ''}>Pago / recebido</option></select></label>
        <label class="campo">Forma<select name="forma">${[['pix', 'Pix'], ['cartao', 'Cartão de crédito'], ['debito', 'Débito'], ['boleto', 'Boleto'], ['dinheiro', 'Dinheiro'], ['outro', 'Outro']].map(([v, n]) => `<option value="${v}" ${l.forma === v ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        ${novo ? '<label class="campo">Parcelas<input name="parcelas" type="number" min="1" max="72" value="1"></label>' : ''}
        <label class="campo ${novo ? '' : 'inteiro'}">&nbsp;<span class="check"><input type="checkbox" name="recorrente" ${l.recorrente ? 'checked' : ''}> Repete todo mês</span></label>
        <label class="campo inteiro">Notas<textarea name="notas" rows="2">${U.esc(l.notas || '')}</textarea></label>
      </div>
      ${!novo && l.texto ? '' : ''}`,
      `${novo ? '' : '<button class="btn btn-perigo esq" data-del>Excluir</button>'}<button class="btn" data-fechar>Cancelar</button><button class="btn btn-p" data-ok>${novo ? 'Lançar' : 'Salvar'}</button>`);
    const f = m.el;
    const campo = (n) => f.querySelector(`[name="${n}"]`);
    const ajustar = () => {
      const tipo = f.querySelector('[name="tipo"]:checked').value;
      f.querySelector('#campo-pagopor').style.display = campo('conta').value === 'casal' ? '' : 'none';
      const atual = campo('categoriaId').value;
      const ehReceita = FC.store.categoria(atual).grupo === 'receita';
      if ((tipo === 'receita') !== ehReceita) campo('categoriaId').innerHTML = T.opcoesCategorias(tipo === 'receita' ? 'salario' : 'outros', tipo);
    };
    f.querySelectorAll('[name="tipo"], [name="conta"]').forEach((x) => x.addEventListener('change', ajustar));
    ajustar();
    // sugestão automática de categoria enquanto digita a descrição
    campo('descricao').addEventListener('change', () => {
      if (!novo) return;
      const tipo = f.querySelector('[name="tipo"]:checked').value;
      const c = A.classificador.classificar({ descricao: campo('descricao').value, tipo });
      if (c.confianca >= 0.55) campo('categoriaId').value = c.categoriaId;
    });
    f.querySelector('[data-ok]').addEventListener('click', () => {
      const valor = U.parseValor(campo('valor').value);
      if (!campo('descricao').value.trim() || !valor) { toast('Preencha descrição e valor.'); return; }
      const d = {
        tipo: f.querySelector('[name="tipo"]:checked').value,
        descricao: campo('descricao').value.trim(), valor,
        categoriaId: campo('categoriaId').value, data: campo('data').value, vencimento: campo('vencimento').value || campo('data').value,
        conta: campo('conta').value, pagoPor: campo('pagoPor').value, status: campo('status').value, forma: campo('forma').value,
        recorrente: campo('recorrente').checked, notas: campo('notas').value,
      };
      if (novo) {
        const n = +(campo('parcelas').value || 1);
        if (n > 1) d.parcela = { n: 1, total: n };
        A.tesoureiro.adicionar(d);
        toast(n > 1 ? `Lançado em ${n} parcelas.` : 'Lançamento salvo.');
      } else {
        A.tesoureiro.atualizar(l.id, d);
        toast('Alterações salvas.');
      }
      m.fechar();
    });
    const del = f.querySelector('[data-del]');
    if (del) del.addEventListener('click', () => { if (confirm(`Excluir "${l.descricao}"?`)) { A.tesoureiro.remover(l.id); m.fechar(); toast('Excluído.'); } });
  }

  function formMeta(meta) {
    const novo = !meta;
    meta = meta || { nome: '', alvo: '', guardado: 0, prazo: '' };
    const m = modal(novo ? 'Nova meta' : 'Editar meta', `
      <div class="grade-campos">
        <label class="campo inteiro">Nome<input name="nome" value="${U.esc(meta.nome)}" placeholder="Ex.: Viagem de aniversário"></label>
        <label class="campo">Valor alvo (R$)<input name="alvo" inputmode="decimal" value="${meta.alvo}"></label>
        <label class="campo">Já guardado (R$)<input name="guardado" inputmode="decimal" value="${meta.guardado}"></label>
        <label class="campo">Prazo<input type="date" name="prazo" value="${meta.prazo || ''}"></label>
      </div>`, '<button class="btn" data-fechar>Cancelar</button><button class="btn btn-p" data-ok>Salvar</button>');
    m.el.querySelector('[data-ok]').addEventListener('click', () => {
      const g = (n) => m.el.querySelector(`[name="${n}"]`).value;
      if (!g('nome').trim() || !U.parseValor(g('alvo'))) { toast('Dê um nome e um valor alvo.'); return; }
      const d = { nome: g('nome').trim(), alvo: U.parseValor(g('alvo')), guardado: U.parseValor(g('guardado')), prazo: g('prazo') };
      if (novo) st().metas.push({ id: U.uid(), ...d }); else Object.assign(st().metas.find((x) => x.id === meta.id), d);
      FC.store.salvar();
      O.log('planejador', `${novo ? 'Criei' : 'Atualizei'} a meta "${d.nome}" (${U.moeda(d.alvo)}).`);
      m.fechar();
    });
  }

  function formAporte(id, retirada) {
    const meta = st().metas.find((x) => x.id === id);
    const m = modal(`${retirada ? 'Retirada de' : 'Aporte em'} ${meta.nome}`, `
      <div class="grade-campos">
        <label class="campo">Valor (R$)<input name="valor" inputmode="decimal" placeholder="0,00"></label>
        <label class="campo">Saiu da conta<select name="conta">${T.opcoesContas('casal')}</select></label>
        ${retirada ? '' : '<label class="campo inteiro"><span class="check"><input type="checkbox" name="lancar" checked> Registrar também como lançamento (categoria Investimentos)</span></label>'}
      </div>`, '<button class="btn" data-fechar>Cancelar</button><button class="btn btn-p" data-ok>Confirmar</button>');
    m.el.querySelector('[data-ok]').addEventListener('click', () => {
      const v = U.parseValor(m.el.querySelector('[name="valor"]').value);
      if (!v) return;
      const lancar = !retirada && m.el.querySelector('[name="lancar"]').checked;
      A.planejador.aportar(id, retirada ? -v : v, lancar, m.el.querySelector('[name="conta"]').value);
      m.fechar(); toast(retirada ? 'Retirada registrada.' : 'Aporte registrado.');
    });
  }

  /* ---------- importação ---------- */
  function ligarImportacao() {
    const zona = document.getElementById('soltar');
    const input = document.getElementById('arquivos');
    const conta = document.getElementById('imp-conta');
    conta.addEventListener('change', () => { ui.impConta = conta.value; });
    input.addEventListener('change', () => processar([...input.files]));
    ['dragenter', 'dragover'].forEach((ev) => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.add('sobre'); }));
    ['dragleave', 'drop'].forEach((ev) => zona.addEventListener(ev, (e) => { e.preventDefault(); zona.classList.remove('sobre'); }));
    zona.addEventListener('drop', (e) => processar([...e.dataTransfer.files]));
  }

  O.on('pipeline', ({ arquivo, etapa }) => {
    const pipe = document.getElementById('pipeline');
    if (!pipe) return;
    document.getElementById('pipe-arq').textContent = etapa === 'pronto' ? `${arquivo}: pronto` : etapa === 'erro' ? `${arquivo}: erro` : arquivo;
    const ordem = ['leitor', 'ia', 'extrator', 'classificador', 'sentinela'];
    const i = ordem.indexOf(etapa);
    pipe.querySelectorAll('.etapa').forEach((el) => {
      const j = ordem.indexOf(el.dataset.etapa);
      el.classList.toggle('ativa', el.dataset.etapa === etapa);
      el.classList.toggle('feita', etapa === 'pronto' || (i >= 0 && j < i));
    });
  });

  async function processar(files) {
    if (!files.length) return;
    ui.processando = true;
    const usarIA = !!(document.getElementById('imp-ia') || {}).checked;
    const conta = ui.impConta;
    for (const f of files) {
      const r = await O.processarArquivo(f, { conta, usarIA });
      ui.rascunhos.push(...r);
    }
    ui.processando = false;
    render();
    toast(`${ui.rascunhos.length} item(ns) prontos para revisão.`);
  }

  function lerRevisao() {
    return [...document.querySelectorAll('tr[data-i]')].map((tr) => {
      const r = ui.rascunhos[+tr.dataset.i];
      return {
        incluir: tr.querySelector('.r-incluir').checked,
        r: Object.assign({}, r, {
          descricao: tr.querySelector('.r-desc').value.trim() || r.descricao,
          categoriaId: tr.querySelector('.r-cat').value,
          conta: tr.querySelector('.r-conta').value,
          vencimento: tr.querySelector('.r-venc').value || r.vencimento,
          status: tr.querySelector('.r-status').value,
          valor: U.parseValor(tr.querySelector('.r-valor').value),
          tipo: tr.querySelector('.r-tipo').value,
        }),
        original: r,
      };
    });
  }

  /* ---------- orçamento: soma ao vivo ---------- */
  function ligarAlocacao() {
    const ins = document.querySelectorAll('[data-balde]');
    const atualizar = () => {
      const s = [...ins].reduce((a, i) => a + Number(i.value || 0), 0);
      const el = document.getElementById('soma-aloc');
      el.textContent = `soma ${s}%`;
      el.style.background = s === 100 ? '' : 'var(--critico-bg)';
      el.style.color = s === 100 ? '' : 'var(--critico)';
    };
    ins.forEach((i) => i.addEventListener('input', atualizar));
    atualizar();
  }

  /* ---------- ações (delegação de eventos) ---------- */
  const acoes = {
    menu: () => document.querySelector('.app').classList.toggle('menu-aberto'),
    ir: (el) => { location.hash = el.dataset.aba; },
    mes: (el) => { ui.ym = U.somaMes(ui.ym, +el.dataset.d); render(); },
    conta: (el) => { ui.conta = el.dataset.conta; render(); },
    novo: () => formLancamento(),
    editar: (el) => formLancamento(st().lancamentos.find((l) => l.id === el.dataset.id)),
    'alternar-pago': (el) => A.tesoureiro.alternarPago(el.dataset.id),
    pagar: (el) => { A.tesoureiro.marcarPagos([el.dataset.id]); toast('Conta marcada como paga.'); },
    'sel-todos': (el) => { document.querySelectorAll('.sel').forEach((c) => { c.checked = el.checked; }); selecao(); },
    'pagar-selecionados': () => { A.tesoureiro.marcarPagos(selecionados()); toast('Contas marcadas como pagas.'); },
    'excluir-selecionados': () => { const ids = selecionados(); if (confirm(`Excluir ${ids.length} lançamento(s)?`)) ids.forEach((id) => A.tesoureiro.remover(id)); },
    'exportar-csv': () => A.arquivista.exportarCSV(telaAtual.lista || [], `lancamentos-${ui.ym}.csv`),
    'exportar-tudo': () => A.arquivista.exportarCSV(st().lancamentos.slice().sort((a, b) => (a.data < b.data ? -1 : 1)), `lancamentos-completo-${U.hoje()}.csv`),
    'exportar-ano': () => {
      const ini = U.somaMes(ui.ym, -11);
      A.arquivista.exportarCSV(st().lancamentos.filter((l) => U.mesDe(l.data) >= ini && U.mesDe(l.data) <= ui.ym).sort((a, b) => (a.data < b.data ? -1 : 1)), `lancamentos-${ini}-a-${ui.ym}.csv`);
    },
    'gerar-recorrentes': () => { const n = A.tesoureiro.gerarRecorrentes(ui.ym); toast(n ? `${n} conta(s) recorrente(s) criadas.` : 'Nenhuma recorrente nova para este mês.'); },
    varredura: () => { const a = A.sentinela.varredura(ui.ym); toast(`${a.length} alerta(s) encontrados.`); render(); },
    'limpar-diario': () => { st().diario = []; FC.store.salvar(); },
    'importar-texto': async () => {
      const txt = document.getElementById('imp-texto').value.trim();
      if (!txt) return;
      const arq = new File([txt], 'texto-colado.txt', { type: 'text/plain' });
      await processar([arq]);
    },
    'modelo-csv': () => A.arquivista.modeloCSV(),
    'descartar-rascunhos': () => { ui.rascunhos = []; render(); },
    'lancar-rascunhos': () => {
      const itens = lerRevisao();
      let n = 0;
      itens.forEach(({ incluir, r, original }) => {
        if (!incluir || !r.valor) return;
        if (r.categoriaId !== original.categoriaId) A.classificador.aprender(r.descricao, r.categoriaId);
        A.tesoureiro.adicionar(r, { silencioso: true });
        n++;
      });
      ui.rascunhos = [];
      O.log('tesoureiro', `Lancei ${n} item(ns) vindos da importação.`);
      toast(`${n} lançamento(s) adicionados.`);
    },
    'salvar-alocacao': () => {
      const novo = {}; document.querySelectorAll('[data-balde]').forEach((i) => { novo[i.dataset.balde] = i.value; });
      const erro = A.planejador.salvarAlocacao(novo);
      toast(erro || 'Divisão da renda salva.');
    },
    'salvar-orcamentos': () => {
      document.querySelectorAll('[data-orc]').forEach((i) => { FC.store.categoria(i.dataset.orc).orcamento = Number(i.value) || 0; });
      FC.store.salvar(); O.log('planejador', 'Orçamentos por categoria atualizados.'); toast('Orçamentos salvos.');
    },
    'modo-divisao': (el) => { st().config.divisao.modo = el.dataset.modo; FC.store.salvar(); O.log('divisor', `Modo de divisão: ${el.textContent}.`); },
    'salvar-pct': () => { st().config.divisao.pctA = Math.min(100, Math.max(0, Number(document.getElementById('pct-a').value))); FC.store.salvar(); },
    'registrar-acerto': () => { A.divisor.registrarAcerto(ui.ym); toast('Acerto registrado.'); },
    aportar: (el) => formAporte(el.dataset.id, false),
    retirar: (el) => formAporte(el.dataset.id, true),
    'nova-meta': () => formMeta(),
    'editar-meta': (el) => formMeta(st().metas.find((m) => m.id === el.dataset.id)),
    'excluir-meta': (el) => { const m = st().metas.find((x) => x.id === el.dataset.id); if (confirm(`Excluir a meta "${m.nome}"?`)) { st().metas = st().metas.filter((x) => x !== m); FC.store.salvar(); } },
    'baixar-resumo': () => U.baixar(`resumo-${ui.ym}.txt`, A.analista.relatorioTexto(ui.ym)),
    imprimir: () => window.print(),
    'salvar-categorias': () => {
      document.querySelectorAll('tr[data-cat]').forEach((tr) => {
        const c = FC.store.categoria(tr.dataset.cat);
        c.nome = tr.querySelector('.c-nome').value.trim() || c.nome;
        c.grupo = tr.querySelector('.c-grupo').value;
        c.orcamento = Number(tr.querySelector('.c-orc').value) || 0;
      });
      FC.store.salvar(); toast('Categorias salvas.');
    },
    'criar-categoria': () => {
      const nome = document.getElementById('nova-cat-nome').value.trim();
      if (!nome) return;
      let id = U.normalizar(nome).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || U.uid();
      if (st().categorias.some((c) => c.id === id)) id += '-' + U.uid().slice(-3);
      st().categorias.push({ id, nome, grupo: document.getElementById('nova-cat-grupo').value, orcamento: Number(document.getElementById('nova-cat-orc').value) || 0 });
      FC.store.salvar(); O.log('classificador', `Nova categoria "${nome}" — passo a reconhecê-la pelo nome.`); toast('Categoria criada.');
    },
    'excluir-categoria': (el) => {
      const c = FC.store.categoria(el.dataset.id);
      const usos = st().lancamentos.filter((l) => l.categoriaId === c.id).length;
      if (!confirm(`Excluir "${c.nome}"?${usos ? ` Os ${usos} lançamento(s) dela vão para "Outros".` : ''}`)) return;
      st().lancamentos.forEach((l) => { if (l.categoriaId === c.id) l.categoriaId = c.grupo === 'receita' ? 'extra' : 'outros'; });
      st().categorias = st().categorias.filter((x) => x.id !== c.id);
      st().regras = st().regras.filter((g) => g.categoriaId !== c.id);
      FC.store.salvar();
    },
    'esquecer-regra': (el) => { st().regras.splice(+el.dataset.i, 1); FC.store.salvar(); },
    'salvar-pessoas': () => {
      st().config.pessoas = { a: document.getElementById('aj-a').value.trim() || 'Pessoa 1', b: document.getElementById('aj-b').value.trim() || 'Pessoa 2' };
      FC.store.salvar(); toast('Nomes salvos.');
    },
    'salvar-ia': () => {
      Object.assign(st().config.ia, { apiKey: document.getElementById('aj-chave').value.trim(), modelo: document.getElementById('aj-modelo').value, sempre: document.getElementById('aj-sempre').checked });
      FC.store.salvar(); O.log('ia', st().config.ia.apiKey ? `Ligado com o modelo ${st().config.ia.modelo}.` : 'Desligado (sem chave).'); toast('Configuração da IA salva.');
    },
    'testar-ia': async (el) => {
      acoes['salvar-ia']();
      el.disabled = true; el.textContent = 'Testando…';
      try { await A.ia.testar(); toast('Conexão OK — o Analista IA está pronto.'); } catch (err) { O.log('ia', `Falha no teste: ${err.message}`, 'erro'); toast('Falhou: ' + err.message); }
      el.disabled = false; el.textContent = 'Testar conexão';
    },
    backup: () => A.arquivista.backup(),
    'carregar-exemplo': () => { if (confirm('Substituir tudo pelos dados de exemplo?')) { FC.store.resetarDemo(); toast('Dados de exemplo carregados.'); } },
    zerar: () => {
      if (!confirm('Apagar todos os lançamentos, metas e o diário? Categorias, orçamentos e ajustes continuam. Faça um backup antes se quiser.')) return;
      const s = st();
      s.lancamentos = []; s.diario = []; s.acertos = []; s.demo = false;
      s.metas = [{ id: 'reserva', nome: 'Reserva de emergência', alvo: 0, guardado: 0, prazo: '', especial: true }];
      FC.store.salvar(); O.log('arquivista', 'Começamos do zero. Bom recomeço!');
    },
  };

  const selecionados = () => [...document.querySelectorAll('.sel:checked')].map((c) => c.value);
  function selecao() {
    const n = selecionados().length;
    document.querySelectorAll('[data-acao="pagar-selecionados"], [data-acao="excluir-selecionados"]').forEach((b) => { b.disabled = !n; });
  }

  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-acao]');
    if (!el || el.tagName === 'SELECT') return;
    const fn = acoes[el.dataset.acao];
    if (!fn) return;
    if (el.tagName === 'A') ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.matches('.alerta[data-acao]')) acoes.ir(ev.target);
    if (ev.key === 'n' && !ev.target.closest('input, textarea, select') && !document.querySelector('.fundo-modal')) { ev.preventDefault(); formLancamento(); }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.classList.contains('sel')) return selecao();
    if (t.dataset.filtro) { ui.filtros[t.dataset.filtro] = t.value; render(); return; }
    if (t.id === 'restaurar' && t.files[0]) {
      A.arquivista.restaurar(t.files[0]).then(() => toast('Backup restaurado.')).catch((err) => toast('Não deu: ' + err.message));
      return;
    }
    if (t.id === 'reserva-meses') { st().config.reservaMeses = Math.max(1, Number(t.value) || 6); FC.store.salvar(); return; }
    const a = t.dataset.acaoChange;
    if (a === 'pago-por') { const l = st().lancamentos.find((x) => x.id === t.dataset.id); l.pagoPor = t.value; FC.store.salvar(); }
    if (a === 'filtro-agente') { ui.filtroAgente = t.value; render(); }
    if (a === 'ocr') { st().config.ocr = t.checked; FC.store.salvar(); }
  });
  let bTimer;
  document.addEventListener('input', (ev) => {
    if (ev.target.dataset.filtro === 'busca') {
      clearTimeout(bTimer);
      bTimer = setTimeout(() => {
        ui.filtros.busca = ev.target.value; render();
        const b = document.querySelector('[data-filtro="busca"]');
        if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); }
      }, 250);
    }
  });

  /* ---------- partida ---------- */
  const mesAtual = U.mesDe(U.hoje());
  const geradas = A.tesoureiro.gerarRecorrentes(mesAtual);
  if (!st().diario.length) {
    O.log('tesoureiro', `Bom dia! ${st().lancamentos.length} lançamentos carregados${st().demo ? ' (dados de exemplo)' : ''}.`);
  }
  A.sentinela.varredura(mesAtual);
  if (geradas) O.log('tesoureiro', `Contas fixas de ${U.mesLabel(mesAtual)} já estão na lista de contas a pagar.`);
  render();
})();

</script>
</body>
</html>
