/* Agente Divisor — conta conjunta do casal: quanto cada um deveria pagar e quem acerta com quem. */
FC.agentes.divisor = (() => {
  const O = FC.orquestrador;
  const U = FC.util;
  const T = () => FC.agentes.tesoureiro;
  const st = () => FC.store.estado;
  O.registrar({
    id: 'divisor', nome: 'Divisor', sigla: 'DI',
    papel: 'Divide as despesas conjuntas (meio a meio, proporcional à renda ou personalizado) e calcula o acerto.',
  });

  function percentualA(ym) {
    const d = st().config.divisao;
    if (d.modo === 'igual') return 50;
    if (d.modo === 'custom') return Number(d.pctA) || 50;
    const ra = T().totais(ym, 'a').receitas;
    const rb = T().totais(ym, 'b').receitas;
    return ra + rb ? ra / (ra + rb) * 100 : 50;
  }

  function acerto(ym) {
    const pctA = percentualA(ym);
    const desp = T().doMes(ym, { conta: 'casal', tipo: 'despesa' });
    const pagas = desp.filter((l) => l.status === 'pago');
    const total = pagas.reduce((s, l) => s + l.valor, 0);
    const pagoA = pagas.filter((l) => l.pagoPor === 'a').reduce((s, l) => s + l.valor, 0);
    const pagoB = total - pagoA;
    const devidoA = total * pctA / 100;
    const acertado = (st().acertos || []).filter((x) => x.ym === ym).reduce((s, x) => s + x.valor, 0);
    const saldoA = pagoA - devidoA - acertado; // > 0: B deve para A
    const aberto = desp.filter((l) => l.status !== 'pago').reduce((s, l) => s + l.valor, 0);
    return { pctA, pctB: 100 - pctA, acertado, total, pagoA, pagoB, devidoA, devidoB: total - devidoA, saldoA, aberto, itens: desp };
  }

  function historico(n = 6, ym) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) { const m = U.somaMes(ym, -i); out.push({ ym: m, ...acerto(m) }); }
    return out;
  }

  function frase(a) {
    const p = st().config.pessoas;
    if (!a.total) return a.aberto ? `Nenhuma despesa conjunta paga ainda — ${U.moeda(a.aberto)} em aberto.` : 'Sem despesas conjuntas neste mês.';
    if (Math.abs(a.saldoA) < 1) return 'Tudo certo: as contas conjuntas estão equilibradas.';
    return a.saldoA > 0
      ? `${p.b} transfere ${U.moeda(a.saldoA)} para ${p.a}.`
      : `${p.a} transfere ${U.moeda(-a.saldoA)} para ${p.b}.`;
  }

  /* O acerto fica registrado e abate a diferença daquele mês. */
  function registrarAcerto(ym) {
    const a = acerto(ym);
    if (Math.abs(a.saldoA) < 1) return;
    st().acertos = st().acertos || [];
    st().acertos.push({ ym, valor: Math.round(a.saldoA * 100) / 100, em: U.hoje() });
    FC.store.salvar();
    O.log('divisor', `Acerto de ${U.mesLabel(ym)} registrado: ${frase(a)}`);
  }

  return { percentualA, acerto, historico, frase, registrarAcerto };
})();

  }

  /* Retorna alertas ordenados por gravidade: critico > atencao > info */
  function alertas(ym) {

    const out = [];
    const abertos = st().lancamentos.filter((l) => l.tipo === 'despesa' && l.status !== 'pago');

    const atrasados = abertos.filter((l) => l.vencimento < h);

    if (em3.length) out.push({ nivel: 'atencao', titulo: `${em3.length} conta(s) vencem em até 3 dias`, texto: em3.slice(0, 3).map((l) => `${l.descricao} — ${U.dataCurta(l.vencimento)}`).join(', '), total: em3.reduce((s, l) => s + l.valor, 0), aba: 'pagar' });

    P.orcamentos(ym).filter((c) => c.orcamento && c.pct >= 90).sort((a, b) => b.pct - a.pct).slice(0, 3).forEach((c) => {
      out.push({ nivel: c.pct > 100 ? 'critico' : 'atencao', titulo: c.pct > 100 ? `${c.nome}: orçamento estourado` : `${c.nome}: ${Math.round(c.pct)}% do orçamento`, texto: `${U.moeda(c.gasto)} de ${U.moeda(c.orcamento)} previstos.`, aba: 'orcamento' });
    });

    const t = T.totais(ym);
    if (ym === U.mesDe(h) && t.receitas && t.despesas > t.receitas) out.push({ nivel: 'critico', titulo: 'Despesas acima da renda no mês', texto: `Faltam ${U.moeda(t.despesas - t.receitas)} para fechar no azul.`, aba: 'relatorios' });

    const mes = st().lancamentos.filter((l) => U.mesDe(l.data) === ym);
    const vistos = new Map(); let dup = 0;
    mes.forEach((l) => { const k = `${l.valor}|${U.normalizar(l.descricao)}`; if (vistos.has(k) && Math.abs(U.diasEntre(vistos.get(k), l.data)) <= 3) dup++; vistos.set(k, l.data); });
    if (dup) out.push({ nivel: 'info', titulo: `${dup} possível(is) lançamento(s) duplicado(s)`, texto: 'Mesmo valor e descrição com até 3 dias de diferença.', aba: 'lancamentos' });

    const ordem = { critico: 0, atencao: 1, info: 2 };

  function varredura(ym) {
    const a = alertas(ym);
    O.log('sentinela', a.length ? `Varredura: ${a.length} alerta(s) — ${a.map((x) => x.titulo).join('; ')}.` : 'Varredura: nada fora do lugar.');
    return a;
  }

  return { alertas, varredura, pareceDuplicado };

/* Agente Analista — séries, comparativos e observações escritas sobre o mês. */
FC.agentes.analista = (() => {
  const O = FC.orquestrador;
  const U = FC.util;
  const T = () => FC.agentes.tesoureiro;
  O.registrar({
    id: 'analista', nome: 'Analista', sigla: 'AN',
    papel: 'Monta séries mensais, compara meses, projeta o fechamento e escreve observações.',
  });

  function serie(ym, n = 12, conta) {
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const m = U.somaMes(ym, -i);
      const t = T().totais(m, conta);
      out.push({ ym: m, receitas: t.receitas, despesas: t.despesas, saldo: t.saldo });
    }
    // não mostra os meses vazios antes do primeiro lançamento (mantém ao menos 3 pontos)
    const primeiro = out.findIndex((x) => x.receitas || x.despesas);
    return primeiro > 0 ? out.slice(Math.min(primeiro, out.length - 3)) : out;
  }

  function porCategoria(ym, conta) {
    const g = {};
    T().doMes(ym, { conta, tipo: 'despesa' }).forEach((l) => { g[l.categoriaId] = (g[l.categoriaId] || 0) + l.valor; });
    return Object.entries(g).map(([id, valor]) => ({ id, nome: FC.store.categoria(id).nome, valor })).sort((a, b) => b.valor - a.valor);
  }

  function porEstabelecimento(ym, conta, n = 8) {
    const g = {};
    T().doMes(ym, { conta, tipo: 'despesa' }).forEach((l) => {
      const k = l.descricao.replace(/\s*[—-]\s*parcela.*$/i, '').trim();
      g[k] = g[k] || { nome: k, valor: 0, vezes: 0 };
      g[k].valor += l.valor; g[k].vezes++;
    });
    return Object.values(g).sort((a, b) => b.valor - a.valor).slice(0, n);
  }

  function observacoes(ym, conta) {
    const obs = [];
    const t = T().totais(ym, conta);
    const ant = T().totais(U.somaMes(ym, -1), conta);
    if (ant.despesas) {
      const v = (t.despesas - ant.despesas) / ant.despesas * 100;
      obs.push(`Despesas ${v >= 0 ? 'subiram' : 'caíram'} ${Math.abs(v).toFixed(0)}% em relação a ${U.mesLabel(U.somaMes(ym, -1))}.`);
    }
    const atual = Object.fromEntries(porCategoria(ym, conta).map((c) => [c.id, c.valor]));
    const passado = Object.fromEntries(porCategoria(U.somaMes(ym, -1), conta).map((c) => [c.id, c.valor]));
    const difs = Object.keys({ ...atual, ...passado }).map((id) => ({ id, d: (atual[id] || 0) - (passado[id] || 0) })).sort((a, b) => b.d - a.d);
    if (difs[0] && difs[0].d > 50) obs.push(`${FC.store.categoria(difs[0].id).nome} foi o que mais cresceu: +${U.moeda(difs[0].d)}.`);
    const fim = difs[difs.length - 1];
    if (fim && fim.d < -50) obs.push(`${FC.store.categoria(fim.id).nome} foi onde mais economizaram: ${U.moeda(fim.d)}.`);
    if (t.receitas) {
      const taxa = (t.receitas - t.despesas) / t.receitas * 100;
      obs.push(taxa >= 0 ? `Taxa de poupança do mês: ${taxa.toFixed(0)}% da renda.` : `O mês fecha ${U.moeda(-t.saldo)} no vermelho.`);
    }
    const h = U.hoje();
    if (ym === U.mesDe(h)) {
      const dia = +h.slice(8, 10);
      const diasMes = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
      const variaveis = T().doMes(ym, { conta, tipo: 'despesa' }).filter((l) => !l.recorrente && !l.parcela && l.data <= h).reduce((s, l) => s + l.valor, 0);
      if (dia > 3) obs.push(`No ritmo atual, gastos variáveis devem fechar o mês em ~${U.moeda(variaveis / dia * diasMes)}.`);
    }
    const top = porEstabelecimento(ym, conta, 1)[0];
    if (top) obs.push(`Maior destino do dinheiro: ${top.nome} (${U.moeda(top.valor)}).`);
    return obs;
  }

  function relatorioTexto(ym) {
    const t = T().totais(ym);
    const linhas = [
      `Resumo financeiro — ${U.mesLabel(ym)}`,
      '',
      `Receitas: ${U.moeda(t.receitas)}`,
      `Despesas: ${U.moeda(t.despesas)} (pagas ${U.moeda(t.pago)}, em aberto ${U.moeda(t.aPagar)})`,
      `Saldo: ${U.moeda(t.saldo)}`,
      '',
      'Por categoria:',
      ...porCategoria(ym).map((c) => `  ${c.nome}: ${U.moeda(c.valor)}`),
      '',
      'Observações:',
      ...observacoes(ym).map((o) => `  • ${o}`),
      '',
      `Conta conjunta: ${FC.agentes.divisor.frase(FC.agentes.divisor.acerto(ym))}`,
    ];
    O.log('analista', `Gerei o resumo de ${U.mesLabel(ym)}.`);
    return linhas.join('\n');
  }

  return { serie, porCategoria, porEstabelecimento, observacoes, relatorioTexto };
})();

/* Agente Arquivista — exporta planilhas, faz backup e restaura seus dados. */
FC.agentes.arquivista = (() => {
  const O = FC.orquestrador;
  const U = FC.util;
  const st = () => FC.store.estado;
  O.registrar({
    id: 'arquivista', nome: 'Arquivista', sigla: 'AR',
    papel: 'Exporta CSV (abre no Excel/Sheets), faz backup completo em JSON e restaura quando precisar.',
  });

  const celula = (v) => {
    const s = String(v ?? '');
    return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };

  function exportarCSV(lista, nome) {
    const p = st().config.pessoas;
    const cab = ['Data', 'Vencimento', 'Tipo', 'Descrição', 'Categoria', 'Grupo', 'Conta', 'Pago por', 'Valor', 'Status', 'Pago em', 'Forma', 'Recorrente', 'Parcela', 'Origem', 'Notas'];
    const linhas = lista.map((l) => [
      U.dataBR(l.data), U.dataBR(l.vencimento), l.tipo, l.descricao, FC.store.categoria(l.categoriaId).nome,
      FC.store.categoria(l.categoriaId).grupo, FC.store.nomeConta(l.conta), l.pagoPor === 'a' ? p.a : p.b,
      l.valor.toFixed(2).replace('.', ','), FC.agentes.tesoureiro.situacao(l), U.dataBR(l.pagoEm), l.forma,
      l.recorrente ? 'sim' : 'não', l.parcela ? `${l.parcela.n}/${l.parcela.total}` : '', l.origem, l.notas,
    ].map(celula).join(';'));
    // BOM para o Excel reconhecer acentos
    U.baixar(nome, '﻿' + [cab.join(';'), ...linhas].join('\r\n'), 'text/csv;charset=utf-8');
    O.log('arquivista', `Exportei ${lista.length} lançamento(s) em "${nome}".`);
  }

  function backup() {
    const nome = `backup-financas-${U.hoje()}.json`;
    const copia = JSON.parse(JSON.stringify(st()));
    copia.config.ia.apiKey = ''; // nunca exporta a chave
    U.baixar(nome, JSON.stringify(copia, null, 2), 'application/json');
    O.log('arquivista', `Backup completo salvo em "${nome}" (${st().lancamentos.length} lançamentos).`);
  }

  async function restaurar(file) {
    const dados = JSON.parse(await file.text());
    if (!dados || !Array.isArray(dados.lancamentos) || !Array.isArray(dados.categorias)) throw new Error('arquivo não parece um backup deste app');
    const chave = st().config.ia.apiKey;
    FC.store.substituir(dados);
    st().config.ia.apiKey = chave;
    FC.store.salvar();
    O.log('arquivista', `Backup "${file.name}" restaurado (${dados.lancamentos.length} lançamentos).`);
  }

  function modeloCSV() {
    U.baixar('modelo-importacao.csv', '﻿Data;Descrição;Valor\r\n05/11/2026;Salário;8200,00\r\n07/11/2026;Carrefour;-412,35\r\n10/11/2026;Aluguel;-2650,00\r\n', 'text/csv;charset=utf-8');
  }

  return { exportarCSV, backup, restaurar, modeloCSV };
})();

  <script>
/* Gráficos em SVG puro (sem bibliotecas). Paleta validada para daltonismo sobre o fundo bege. */
FC.graficos = (() => {
  const U = FC.util;
  const SERIES = ['#4F8A1F', '#A4448F', '#D08A00', '#2F6FC0', '#C4502A', '#12937F'];
  const NEUTRO = '#D6CCB6';
  const SUPERFICIE = '#FBF8F1';
  const UNICA = '#5E7A3A';

  let tip;
  function tooltip() {
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'status'); document.body.appendChild(tip); }
    return tip;
  }
  /* linhas: [{cor, valor, rotulo}] — valor em destaque, rótulo secundário */
  function mostrarTip(ev, titulo, linhas) {
    const t = tooltip();
    t.replaceChildren();
    if (titulo) { const h = document.createElement('div'); h.className = 'tip-t'; h.textContent = titulo; t.appendChild(h); }
    linhas.forEach((l) => {
      const r = document.createElement('div'); r.className = 'tip-r';
      if (l.cor) { const k = document.createElement('i'); k.style.background = l.cor; r.appendChild(k); }
      const v = document.createElement('b'); v.textContent = l.valor; r.appendChild(v);
      if (l.rotulo) { const s = document.createElement('span'); s.textContent = l.rotulo; r.appendChild(s); }
      t.appendChild(r);
    });
    t.style.opacity = 1;
    const x = ev.clientX ?? (ev.target.getBoundingClientRect().left + 10);
    const y = ev.clientY ?? ev.target.getBoundingClientRect().top;
    const w = t.offsetWidth;
    t.style.left = Math.min(window.innerWidth - w - 8, x + 14) + 'px';
    t.style.top = (y + 14) + 'px';
  }
  function esconderTip() { if (tip) tip.style.opacity = 0; }

  /* ---------- rosca (alocação da renda) ---------- */
  function rosca(el, fatias, centro) {
    const total = fatias.reduce((s, f) => s + f.valor, 0) || 1;
    const R = 78, r = 54, C = 90;
    let ang = -Math.PI / 2;
    const arcos = fatias.filter((f) => f.valor > 0).map((f) => {
      const a = f.valor / total * Math.PI * 2;
      const a0 = ang, a1 = ang + a; ang = a1;
      const larg = a > Math.PI ? 1 : 0;
      const p = (rad, ang2) => `${C + rad * Math.cos(ang2)} ${C + rad * Math.sin(ang2)}`;
      const d = a >= Math.PI * 2 - 0.001
        ? `M ${C - R} ${C} a ${R} ${R} 0 1 0 ${2 * R} 0 a ${R} ${R} 0 1 0 ${-2 * R} 0 M ${C - r} ${C} a ${r} ${r} 0 1 1 ${2 * r} 0 a ${r} ${r} 0 1 1 ${-2 * r} 0`
        : `M ${p(R, a0)} A ${R} ${R} 0 ${larg} 1 ${p(R, a1)} L ${p(r, a1)} A ${r} ${r} 0 ${larg} 0 ${p(r, a0)} Z`;
      return { ...f, d, pct: f.valor / total * 100 };
    });
    el.innerHTML = `
      <div class="rosca">
        <svg viewBox="0 0 180 180" role="img" aria-label="Distribuição da renda">
          ${arcos.map((a, i) => `<path class="fatia" data-i="${i}" d="${a.d}" fill="${a.cor}" stroke="${SUPERFICIE}" stroke-width="2" fill-rule="evenodd" tabindex="0"></path>`).join('')}
          <text x="90" y="86" text-anchor="middle" class="rosca-v">${U.esc(centro.valor)}</text>
          <text x="90" y="104" text-anchor="middle" class="rosca-r">${U.esc(centro.rotulo)}</text>
        </svg>
        <ul class="legenda">
          ${fatias.map((f) => `<li><i style="background:${f.cor}"></i><span>${U.esc(f.nome)}</span><b>${U.pct(f.valor / total * 100)}</b>${f.meta != null ? `<em>meta ${f.meta}%</em>` : ''}</li>`).join('')}
        </ul>
      </div>`;
    el.querySelectorAll('.fatia').forEach((p) => {
      const a = arcos[+p.dataset.i];
      const mostrar = (ev) => mostrarTip(ev, a.nome, [{ cor: a.cor, valor: U.moeda(a.valor), rotulo: `${U.pct(a.pct)} da renda` }]);
      p.addEventListener('pointermove', mostrar); p.addEventListener('focus', mostrar);
      p.addEventListener('pointerleave', esconderTip); p.addEventListener('blur', esconderTip);
    });
  }

  /* ---------- barras horizontais (categorias), com marca do orçamento ---------- */
  function barras(el, itens, { max = 8, mostrarOrcamento = true } = {}) {
    const lista = itens.slice(0, max);
    if (!lista.length) { el.innerHTML = '<p class="vazio">Sem despesas neste período.</p>'; return; }
    const topo = Math.max(...lista.map((i) => Math.max(i.valor, mostrarOrcamento ? i.orcamento || 0 : 0))) || 1;
    el.innerHTML = `<div class="barras">${lista.map((i, k) => {
      const w = i.valor / topo * 100;
      const o = i.orcamento && mostrarOrcamento ? i.orcamento / topo * 100 : null;
      return `<div class="barra-l" data-k="${k}" tabindex="0">
        <span class="barra-n">${U.esc(i.nome)}</span>
        <span class="barra-trilho">
          <span class="barra-f" style="width:${Math.max(w, 0.8)}%;background:${UNICA}"></span>
          ${o != null ? `<span class="barra-o" style="left:${o}%" title="orçamento"></span>` : ''}
        </span>
        <span class="barra-v">${U.moeda(i.valor)}</span>
      </div>`;
    }).join('')}</div>`;
    el.querySelectorAll('.barra-l').forEach((b) => {
      const i = lista[+b.dataset.k];
      const linhas = [{ cor: UNICA, valor: U.moeda(i.valor), rotulo: 'gasto' }];
      if (i.orcamento) linhas.push({ valor: U.moeda(i.orcamento), rotulo: `orçamento · ${Math.round(i.valor / i.orcamento * 100)}% usado` });
      const mostrar = (ev) => mostrarTip(ev, i.nome, linhas);
      b.addEventListener('pointermove', mostrar); b.addEventListener('focus', mostrar);
      b.addEventListener('pointerleave', esconderTip); b.addEventListener('blur', esconderTip);
    });
  }

  /* ---------- linhas (receitas x despesas por mês) com mira e tooltip ---------- */
  function linhas(el, pontos, series) {
    const W = Math.max(320, el.clientWidth || 640), H = 240;
    const m = { t: 16, r: 74, b: 28, l: 56 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const maxV = Math.max(...pontos.flatMap((p) => series.map((s) => p[s.chave]))) || 1;
    const passo = Math.pow(10, Math.floor(Math.log10(maxV)));
    const topo = Math.ceil(maxV / passo / 2) * passo * 2 || 1;
    const x = (i) => m.l + (pontos.length === 1 ? iw / 2 : i / (pontos.length - 1) * iw);
    const y = (v) => m.t + ih - v / topo * ih;
    const grades = [0, 0.25, 0.5, 0.75, 1].map((f) => f * topo);

    const caminho = (chave) => pontos.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p[chave]).toFixed(1)}`).join(' ');
    const ult = pontos.length - 1;
    const passoRot = Math.max(1, Math.ceil(pontos.length * 48 / iw)); // evita rótulos de mês encavalados
    // rótulos diretos no fim das linhas, afastados se colidirem
    const fins = series.map((s) => ({ s, y: y(pontos[ult][s.chave]) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < fins.length; i++) if (fins[i].y - fins[i - 1].y < 14) fins[i].y = fins[i - 1].y + 14;

    el.innerHTML = `
      <ul class="legenda legenda-h">${series.map((s) => `<li><i class="linha-k" style="background:${s.cor}"></i><span>${U.esc(s.nome)}</span></li>`).join('')}</ul>
      <svg class="grafico-linhas" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Receitas e despesas por mês">
        ${grades.map((g) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(g)}" y2="${y(g)}" class="grade"/><text x="${m.l - 8}" y="${y(g) + 4}" text-anchor="end" class="eixo">${U.esc(g ? U.moedaCurta(g).replace(/^R\$\s*/, '') : '0')}</text>`).join('')}
        ${pontos.map((p, i) => ((ult - i) % passoRot === 0) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" class="eixo">${U.esc(U.mesCurto(p.ym))}</text>` : '').join('')}
        ${series.map((s) => `<path d="${caminho(s.chave)}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${s.tracejado ? 'stroke-dasharray="5 4"' : ''}/>`).join('')}
        ${fins.map((f) => `<text x="${x(ult) + 8}" y="${f.y + 4}" class="rotulo-fim">${U.esc(f.s.nome)}</text>`).join('')}
        <line class="mira" y1="${m.t}" y2="${m.t + ih}" x1="-10" x2="-10"/>
        ${series.map((s, k) => `<circle class="ponto" data-s="${k}" r="4.5" cx="-10" cy="-10" fill="${s.cor}" stroke="${SUPERFICIE}" stroke-width="2"/>`).join('')}
        <rect class="alvo" x="${m.l - 10}" y="${m.t}" width="${iw + 20}" height="${ih}" fill="transparent" tabindex="0"/>
      </svg>`;

    const svg = el.querySelector('svg');
    const mira = svg.querySelector('.mira');
    const pts = svg.querySelectorAll('.ponto');
    const alvo = svg.querySelector('.alvo');
    let atual = ult;
    const mover = (i, ev) => {
      atual = i;
      const p = pontos[i];
      mira.setAttribute('x1', x(i)); mira.setAttribute('x2', x(i));
      pts.forEach((c, k) => { c.setAttribute('cx', x(i)); c.setAttribute('cy', y(p[series[k].chave])); });
      mostrarTip(ev, U.mesLabel(p.ym), series.map((s) => ({ cor: s.cor, valor: U.moeda(p[s.chave]), rotulo: s.nome }))
        .concat([{ valor: U.moeda(p.receitas - p.despesas), rotulo: 'saldo' }]));
    };
    alvo.addEventListener('pointermove', (ev) => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * W;
      mover(Math.max(0, Math.min(ult, Math.round((px - m.l) / iw * ult))), ev);
    });
    alvo.addEventListener('keydown', (ev) => {
      if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') {
        ev.preventDefault();
        const r = alvo.getBoundingClientRect();
        mover(Math.max(0, Math.min(ult, atual + (ev.key === 'ArrowLeft' ? -1 : 1))), { clientX: r.left + x(atual) / W * r.width, clientY: r.top + 20 });
      }
    });
    const sair = () => { esconderTip(); mira.setAttribute('x1', -10); mira.setAttribute('x2', -10); pts.forEach((c) => c.setAttribute('cx', -10)); };
    alvo.addEventListener('pointerleave', sair); alvo.addEventListener('blur', sair);
  }

  /* ---------- barra de progresso simples ---------- */
  function progresso(pct, nivel) {
    const cls = nivel || (pct > 100 ? 'critico' : pct >= 90 ? 'atencao' : 'ok');
    return `<span class="prog prog-${cls}"><span style="width:${Math.min(100, Math.max(0, pct))}%"></span></span>`;
  }

  return { SERIES, NEUTRO, rosca, barras, linhas, progresso, mostrarTip, esconderTip };
})();

          ${proximos.length ? `<div class="lista">${proximos.map((l) => itemConta(l, h)).join('')}</div>` : '<p class="vazio">Nenhuma conta em aberto.</p>'}
        </section>
        <section class="cartao"><header><h3>Conta conjunta</h3><button class="btn btn-l" data-acao="ir" data-aba="casal">detalhes</button></header>
          <p style="margin:0 0 12px;font-size:15px">${e(A.divisor.frase(ac))}</p>
          <div class="pessoa" style="padding:12px 14px">
            <div class="linha"><span>Gasto conjunto pago</span><b>${U.moeda(ac.total)}</b></div>
            <div class="linha"><span>${e(pessoas().a)} pagou</span><b>${U.moeda(ac.pagoA)}</b></div>
            <div class="linha"><span>${e(pessoas().b)} pagou</span><b>${U.moeda(ac.pagoB)}</b></div>
            <div class="linha"><span>Divisão</span><b>${Math.round(ac.pctA)}% / ${Math.round(ac.pctB)}%</b></div>
            ${ac.aberto ? `<div class="linha"><span>Em aberto</span><b>${U.moeda(ac.aberto)}</b></div>` : ''}
          </div>
        </section>
        <section class="cartao"><header><h3>Reserva e metas</h3><button class="btn btn-l" data-acao="ir" data-aba="metas">metas</button></header>
          <div style="display:flex;justify-content:space-between;font-size:13px"><span>Reserva de emergência</span><b>${U.moeda(res.guardado)}</b></div>
          ${G.progresso(res.pct, 'meta')}
          <p class="muted" style="font-size:12px;margin:5px 0 14px">Cobre ${res.meses.toFixed(1)} de ${st().config.reservaMeses} meses de custo essencial (alvo ${U.moeda(res.alvo)}).</p>
          ${metas.map((m) => `<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:8px"><span>${e(m.nome)}</span><span class="muted">${Math.round(m.pct)}%</span></div>${G.progresso(m.pct, 'meta')}`).join('')}
        </section>
      </div>`;

    const depois = () => {
      G.linhas(document.getElementById('g-linhas'), A.analista.serie(ctx.ym, 12, conta), [
        { chave: 'receitas', nome: 'Receitas', cor: G.SERIES[0] },
        { chave: 'despesas', nome: 'Despesas', cor: G.SERIES[1] },
      ]);
      const orc = Object.fromEntries(st().categorias.map((c) => [c.id, c.orcamento]));
      G.barras(document.getElementById('g-cat'), A.analista.porCategoria(ctx.ym, conta).map((c) => ({ ...c, orcamento: conta ? 0 : orc[c.id] })), { max: 8 });
      const aloc = A.planejador.alocacao(ctx.ym, conta);
      const cores = [G.SERIES[0], G.SERIES[1], G.SERIES[2], G.SERIES[3], G.NEUTRO];
      G.rosca(document.getElementById('g-rosca'), aloc.map((b, i) => ({ nome: b.nome, valor: b.real, cor: cores[i], meta: b.pctPlano })),
        { valor: U.moedaCurta(t.receitas), rotulo: 'renda do mês' });
    };
    return { html, depois };
  }

  function itemConta(l, h) {
    const d = U.parseISO(l.vencimento);
    const dias = U.diasEntre(h, l.vencimento);
    const quando = dias < 0 ? `${-dias} dia(s) de atraso` : dias === 0 ? 'vence hoje' : dias === 1 ? 'vence amanhã' : `em ${dias} dias`;
    return `<div class="item">
      <div class="dia"><b>${d.getDate()}</b><span>${U.MESES_CURTOS[d.getMonth()]}</span></div>
      <div class="t">${e(l.descricao)}<small>${e(cat(l.categoriaId).nome)} · ${e(FC.store.nomeConta(l.conta))} · ${quando}</small></div>
      <div class="v">${U.moeda(l.valor)}</div>
      <button class="btn btn-pq" data-acao="pagar" data-id="${l.id}">Pagar</button>
    </div>`;
  }

  /* =============== LANÇAMENTOS =============== */
  function lancamentos(ctx) {
    const f = ctx.filtros;
    const lista = A.tesoureiro.doMes(ctx.ym, { conta: contaFiltro(ctx.conta), ...f });
    const rec = lista.filter((l) => l.tipo === 'receita').reduce((s, l) => s + l.valor, 0);
    const desp = lista.filter((l) => l.tipo === 'despesa').reduce((s, l) => s + l.valor, 0);
    const html = `
      <section class="cartao">
        <div class="filtros">
          <input type="search" placeholder="Buscar descrição, nota ou categoria" value="${e(f.busca || '')}" data-filtro="busca">
          <select data-filtro="tipo"><option value="todos">Receitas e despesas</option><option value="despesa" ${f.tipo === 'despesa' ? 'selected' : ''}>Só despesas</option><option value="receita" ${f.tipo === 'receita' ? 'selected' : ''}>Só receitas</option></select>
          <select data-filtro="categoriaId"><option value="todas">Todas as categorias</option>${opcoesCategorias(f.categoriaId)}</select>
          <select data-filtro="situacao">${[['todas', 'Qualquer status'], ['aberto', 'Em aberto'], ['pago', 'Pagos'], ['atrasado', 'Atrasados']].map(([v, n]) => `<option value="${v}" ${f.situacao === v ? 'selected' : ''}>${n}</option>`).join('')}</select>
          <span style="margin-left:auto" class="linha-acoes">
            <button class="btn" data-acao="pagar-selecionados" disabled>Marcar pagos</button>
            <button class="btn" data-acao="excluir-selecionados" disabled>Excluir</button>
            <button class="btn" data-acao="exportar-csv">Exportar CSV</button>
          </span>
        </div>
        <div class="tabela-envolve">
        <table class="tabela">
          <thead><tr><th style="width:28px"><input type="checkbox" class="check" data-acao="sel-todos" aria-label="Selecionar todos"></th><th>Data</th><th>Descrição</th><th>Conta</th><th>Vencimento</th><th>Status</th><th class="num">Valor</th><th></th></tr></thead>
          <tbody>
          ${lista.length ? lista.map((l) => `<tr>
            <td><input type="checkbox" class="sel" value="${l.id}" aria-label="Selecionar"></td>
            <td>${U.dataCurta(l.data)}</td>
            <td class="desc">${e(l.descricao)}${l.origem === 'ia' ? ' <span class="etq etq-ia">IA</span>' : ''}<small>${e(cat(l.categoriaId).nome)} · ${e(l.forma || '')}${l.recorrente ? ' · recorrente' : ''}${l.conta === 'casal' ? ` · pago por ${e(l.pagoPor === 'a' ? pessoas().a : pessoas().b)}` : ''}</small></td>
            <td>${etqConta(l.conta)}</td>
            <td>${l.tipo === 'despesa' ? U.dataCurta(l.vencimento) : '—'}</td>
            <td>${pill(l)}</td>
            <td class="num ${l.tipo === 'receita' ? 'receita-v' : ''}">${l.tipo === 'receita' ? '+' : ''}${U.moeda(l.valor)}</td>
            <td class="acoes"><button class="btn btn-l btn-pq" data-acao="editar" data-id="${l.id}">editar</button></td>
          </tr>`).join('') : `<tr><td colspan="8" class="vazio">Nenhum lançamento em ${U.mesLabel(ctx.ym)} com esses filtros.</td></tr>`}
          </tbody>
          <tfoot><tr><td></td><td colspan="5">${lista.length} lançamento(s) · receitas ${U.moeda(rec)} · despesas ${U.moeda(desp)}</td><td class="num">${U.moeda(rec - desp)}</td><td></td></tr></tfoot>
        </table>
        </div>
      </section>`;
    return { html, lista };
  }

  /* =============== CONTAS A PAGAR =============== */
  function pagar(ctx) {
    const h = U.hoje();
    const conta = contaFiltro(ctx.conta);
    const abertas = st().lancamentos.filter((l) => l.tipo === 'despesa' && l.status !== 'pago' && (!conta || l.conta === conta))
      .sort((a, b) => (a.vencimento < b.vencimento ? -1 : 1));
    const grupos = [
      ['Atrasadas', abertas.filter((l) => l.vencimento < h)],
      ['Hoje', abertas.filter((l) => l.vencimento === h)],
      ['Próximos 7 dias', abertas.filter((l) => l.vencimento > h && U.diasEntre(h, l.vencimento) <= 7)],
      [`Resto de ${U.mesLabel(ctx.ym)}`, abertas.filter((l) => U.diasEntre(h, l.vencimento) > 7 && U.mesDe(l.vencimento) === ctx.ym)],
      ['Mais adiante', abertas.filter((l) => U.diasEntre(h, l.vencimento) > 7 && U.mesDe(l.vencimento) > ctx.ym)],
    ];
    const pagas = A.tesoureiro.doMes(ctx.ym, { conta, tipo: 'despesa', situacao: 'pago' });
    const soma = (ls) => ls.reduce((s, l) => s + l.valor, 0);
    const html = `
      <div class="grade-21">
        <section class="cartao secao-pagar">
          <header><h3>Em aberto</h3><span class="sub">${abertas.length} conta(s) · ${U.moeda(soma(abertas))}</span>
            <button class="btn" data-acao="gerar-recorrentes">Gerar recorrentes do mês</button></header>
          ${grupos.filter(([, ls]) => ls.length).map(([t, ls]) => `
            <h4><span>${t}</span><span>${U.moeda(soma(ls))}</span></h4>
            <div class="lista" style="margin-bottom:14px">${ls.slice(0, 30).map((l) => itemConta(l, h)).join('')}</div>`).join('') || '<p class="tudo-certo">Nenhuma conta em aberto. 👏</p>'}
        </section>
        <section class="cartao">
          <header><h3>Pagas em ${U.mesLabel(ctx.ym)}</h3><span class="sub">${U.moeda(soma(pagas))}</span></header>
          <div class="lista">${pagas.slice(0, 40).map((l) => `<div class="item" style="grid-template-columns:52px 1fr auto auto">
            <div class="dia"><b>${+l.pagoEm.slice(8, 10) || +l.data.slice(8, 10)}</b><span>${U.MESES_CURTOS[+(l.pagoEm || l.data).slice(5, 7) - 1]}</span></div>
            <div class="t">${e(l.descricao)}<small>${e(cat(l.categoriaId).nome)}</small></div>
            <div class="v">${U.moeda(l.valor)}</div>
            <button class="btn btn-l btn-pq" data-acao="alternar-pago" data-id="${l.id}" title="Desfazer">desfazer</button>
          </div>`).join('') || '<p class="vazio">Nada pago ainda neste mês.</p>'}</div>
        </section>
      </div>`;
    return { html: html.replace(' 👏', '') };
  }

  /* =============== IMPORTAR =============== */
  function importar(ctx) {
    const ia = A.ia.disponivel();
    const r = ctx.rascunhos;
    const etapas = [['leitor', 'LE', 'Leitor'], ['ia', 'IA', 'Analista IA'], ['extrator', 'EX', 'Extrator'], ['classificador', 'CL', 'Classificador'], ['sentinela', 'SE', 'Sentinela']];
    const html = `
      <div class="grade-12">
        <section class="cartao">
          <header><h3>Enviar documentos</h3></header>
          <label class="soltar" id="soltar">
            <input type="file" id="arquivos" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.csv,.ofx,.txt" hidden>
            <h3>Arraste recibos, boletos e extratos</h3>
            <p>ou clique para escolher arquivos</p>
            <div class="formatos"><span class="etq">PDF</span><span class="etq">Foto do cupom</span><span class="etq">Boleto</span><span class="etq">Extrato CSV</span><span class="etq">OFX</span></div>
          </label>
          <div class="grade-campos mt">
            <label class="campo">Lançar na conta<select id="imp-conta">${opcoesContas(ctx.impConta || 'casal')}</select></label>
